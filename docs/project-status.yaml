  priority: "P5-highest-value-authorized-roadmap"
  action: "This session implemented AI-FRD-2's first exit criterion: the optional `discovery_coverage` ISA criterion (see current_milestone.known_gap above). Next continuation, in order of dependency: (1) wire research_freshness.py's AI-FRD-5 reasoning into run_research_question/a Research Session so a correction or retraction can actually qualify or invalidate a prior narrative -- AI-FRD-5's own remaining two exit criteria, and the largest remaining piece of this milestone; (2) that wiring will also need an answer/session versioning concept (prior answer text must never be silently overwritten), which does not exist yet anywhere in this repo and should be scoped explicitly before being built, not implied by the freshness wiring alone; (3) once (1)/(2) exist, extend the discovery_coverage criterion (or add a sibling one) to cover correction/retraction findings, not just provider-attempt success; (4) AI-FRD-3/AI-FRD-4 wiring (discovery_policy.py)'s own next steps -- tune the conservative defaults against real traffic; (5) surfacing ResearchQuestionResult.discovery in Web remains Web-side work, not this repo's, and is not yet reachable in practice since Web's /ask does not pass a discovery_policy to run_research_question (opting Web's existing /ask traffic into autonomous federated-discovery cost/latency is a product-owner decision this repository does not make unilaterally, per discovery_policy.py's own docstring)."
