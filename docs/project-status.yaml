next_continuation:
  priority: "P5-highest-value-authorized-roadmap"
  action: "This session (2026-08-22, later still than the session-freshness caller session) implemented item (1) of the prior next_continuation, and only that item, per this repository's 'at most one substantial new roadmap implementation per run' policy: the AnswerFreshness read-side projection. copilot/research_freshness.py gained AnswerFreshness (a frozen dataclass: session_id, research_question_id, answer_version, status, supersedes_session_id, superseded_by_session_id, narrative_invalidated_at, rerun_recommended, pending_flips, plus a releaseable property that is True iff status is SessionStatus.COMPLETED and narrative_invalidated_at is None -- the exact two-field check the design doc specifies) and build_answer_freshness(), which assembles one from a ResearchSession plus this module's own already-computed RerunRecommendation and crosswalked NarrativeTouchingFlips. It queries nothing itself, the same 'caller owns the I/O' shape observability.build_session_trace already established. cli.py's session-freshness command is now this projection's first real caller: every invocation builds and reports it (text output gains a 'Releaseable (answer_version N): yes/no' line; --format json gains an answer_freshness object with answer_version/status/supersedes_session_id/superseded_by_session_id/narrative_invalidated_at/pending_flip_count/releaseable), reflecting that same invocation's own newly-recorded invalidation immediately when --apply finds one (via dataclasses.replace on the session passed in, not a stale pre-check read). superseded_by_session_id has no repository lookup to derive it from yet -- no caller mints a version-N+1 session, so it defaults to None, honestly describing 'not superseded' for every session today. 6 new unit tests (tests/copilot/test_research_freshness.py) plus 1 new CLI test extending existing JSON-output coverage (tests/test_cli_session_freshness.py), 415 total pass (408 pre-existing + 7 new, ruff/mypy/pip-audit/git-diff-check all clean) via scripts/preflight.py. No change to run_research_question.py, orchestrator/close_gate.py, any existing function's signature, or any ResearchSession/ResearchEvent schema field -- knowledge-engine-web is unaffected (it pins a specific knowledge-engine-ai commit and never calls research_freshness.py or this command directly); no cross-repo action needed. Next continuation, in order of dependency: (1) a caller that mints a version-N+1 session (sets answer_version=prior+1/supersedes_session_id=prior.session_id at create_session time) and calls supersede_session() on the prior version once N+1 reaches COMPLETED -- per the design doc's 'Interaction with session close gates' section; (2) the still-open product/policy decision of who/what invokes session-freshness and how often (a scheduled job, a person, a Web page load) -- this and the prior session deliberately left it manual/on-demand rather than guessing a policy; (3) once (1)-(2) land, extend the discovery_coverage ISA criterion (or add a sibling one) to cover correction/retraction findings, not just provider-attempt success; (4) AI-FRD-3/AI-FRD-4 wiring (discovery_policy.py)'s own next steps -- tune the conservative defaults against real traffic; (5) surfacing ResearchQuestionResult.discovery in Web remains Web-side work, not this repo's, and is not yet reachable in practice since Web's /ask does not pass a discovery_policy to run_research_question (a product-owner decision this repository does not make unilaterally, per discovery_policy.py's own docstring)."
  selection_rule: "Before beginning roadmap work, query live PR state. Handle failed, green, blocked, conflicted, or pending existing work according to docs/agent-development-policy.md and knowledge-engine-core's shared policy document."

