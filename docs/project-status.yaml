next_continuation:
  priority: "P5-highest-value-authorized-roadmap"
  action: "This session (2026-08-22, later still than the session-freshness-caller session) implemented item (1) of the prior next_continuation, and only that item, per this repository's 'at most one substantial new roadmap implementation per run' policy: the AnswerFreshness read-side projection. copilot/research_freshness.py gained AnswerFreshness (session_id, research_question_id, answer_version, status, supersedes_session_id, superseded_by_session_id, narrative_invalidated_at, rerun_recommended, pending_flips, and a releaseable property mirroring the design doc's COMPLETED-and-not-invalidated check) and build_answer_freshness(), a pure projection over already-fetched data -- no SessionRepository/ke call inside it, matching observability.build_session_trace's own shape. pending_flips is typed as NarrativeTouchingFlip (richer than the design sketch's bare PublicationStatusFlip) so a caller can explain why a flip is pending, not just that one exists. superseded_by_session_id required a new read path since no session row stores a forward pointer to whatever replaced it: SessionRepository gained list_sessions_for_research_question(), listing every session in one research_question_id thread ordered by answer_version. ke-ai session-freshness is the projection's first real caller: its text and --format json output now include an 'Answer freshness' section (answer_version, status, releaseable, pending_flips count, narrative_invalidated_at, superseded_by_session_id), built from the session state re-read after a possible --apply write so it reflects the post-invalidation state, not the value read before that run started. 10 new tests (7 in tests/copilot/test_research_freshness.py, 2 in tests/sessions/test_repository.py, 1 in tests/test_cli_session_freshness.py, plus strengthened assertions in 3 pre-existing tests in that last file), 418 total pass (408 pre-existing + 10 new); full local quality gate (ruff format --check, ruff check, mypy, pytest, pip-audit, git diff --check) passed via scripts/preflight.py. Deliberately does not mint a version-N+1 session or call supersede_session(), and does not decide *when* a freshness check should run -- both remain open per the design doc's own next continuation. No change to run_research_question.py, orchestrator/close_gate.py, any existing function's signature, or any ResearchSession/ResearchEvent schema field -- knowledge-engine-web is unaffected (it pins a specific knowledge-engine-ai commit and never calls research_freshness.py or this command directly); no cross-repo action needed, and none was required: this is a pure read-side addition inside knowledge-engine-ai's own session store, consumed today only by its own CLI. Next continuation, in order of dependency: (1) a caller that mints a version-N+1 session (sets answer_version=prior+1/supersedes_session_id=prior.session_id at create_session time) and calls supersede_session() on the prior version once N+1 reaches COMPLETED -- per the design doc's 'Interaction with session close gates' section; (2) the still-open product/policy decision of who/what invokes session-freshness and how often (a scheduled job, a person, a Web page load) -- this and the prior session deliberately left it manual/on-demand rather than guessing a policy; (3) once (1)-(2) land, extend the discovery_coverage ISA criterion (or add a sibling one) to cover correction/retraction findings, not just provider-attempt success; (4) AI-FRD-3/AI-FRD-4 wiring (discovery_policy.py)'s own next steps -- tune the conservative defaults against real traffic; (5) surfacing ResearchQuestionResult.discovery in Web remains Web-side work, not this repo's, and is not yet reachable in practice since Web's /ask does not pass a discovery_policy to run_research_question (a product-owner decision this repository does not make unilaterally, per discovery_policy.py's own docstring)."
  selection_rule: "Before beginning roadmap work, query live PR state. Handle failed, green, blocked, conflicted, or pending existing work according to docs/agent-development-policy.md and knowledge-engine-core's shared policy document."

