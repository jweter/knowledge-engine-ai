next_continuation:
  priority: "P5-highest-value-authorized-roadmap"
  action: "This session implemented AI-FRD-5's first exit criterion as a bounded, tested, deliberately unwired slice: copilot/research_freshness.py (assess_rerun_need, diff_candidate_snapshots) plus its first caller, `ke-ai research-freshness`. See current_milestone.known_gap above for the full account. Next continuation, in order of dependency: (1) wire research_freshness.py's reasoning into run_research_question/a Research Session so a correction or retraction can actually qualify or invalidate a prior narrative -- AI-FRD-5's own remaining two exit criteria, and the largest remaining piece of this milestone; (2) that wiring will also need an answer/session versioning concept (prior answer text must never be silently overwritten), which does not exist yet anywhere in this repo and should be scoped explicitly before being built, not implied by the freshness wiring alone; (3) AI-FRD-3/AI-FRD-4 wiring (discovery_policy.py)'s own next steps -- tune the conservative defaults against real traffic; (4) AI-FRD-2 coverage-aware Research ISA remains not started; (5) surfacing ResearchQuestionResult.discovery in Web remains Web-side work, not this repo's, and is not yet reachable in practice since Web's /ask does not pass a discovery_policy to run_research_question (opting Web's existing /ask traffic into autonomous federated-discovery cost/latency is a product-owner decision this repository does not make unilaterally, per discovery_policy.py's own docstring)."
  selection_rule: "Before beginning roadmap work, query live PR state. Handle failed, green, blocked, conflicted, or pending existing work according to docs/agent-development-policy.md and knowledge-engine-core's shared policy document."

