product:
  primary_surface: "Python library: the judgment/orchestration layer over knowledge-engine-core's validated evidence graph"
  role_in_family: "owns Research Copilot orchestration and the supported subprocess boundary to Core; consumed by knowledge-engine-web"
  research_copilot_status: "General Question Research Loop grounded completion, deterministic verification, Research ISA close gates, progressive research state, bottleneck/funnel reporting, and Research Report v1's structured report contract are implemented. The structured report has not yet passed the deployed Web Monster acceptance case end to end."

current_milestone:
  name: "Research Report v1 — end-to-end product acceptance"
  roadmap_file: "docs/roadmap/research_report_v1.md"
  state: "active"
  tracking_issue: "#129"
  acceptance_case: "#79 monster-energy-bp-one-year"
  objective: "Match or exceed a strong scholarly-assistant answer for readability while materially exceeding it in provenance, evidence-boundary discipline, contradiction handling, missing-evidence disclosure, and auditability."
  implementation_state: "PR #130 merged the typed ResearchReport contract and deterministic validation. PR #131 merged the fail-closed completed-session integration seam. The AI layer can now build a structured report only from a releaseable completed research result using the effective grounded EvidenceReport and existing ResearchProgressReport."
  blocking_gap: "knowledge-engine-web has not yet completed consumption/rendering of Research Report v1, and the Monster #79 deployed end-to-end acceptance run has not yet passed."
  priority_rule: "Until Monster #79 passes end to end, do not let unrelated non-blocking orchestration abstractions outrank report integration, report correctness, Web consumption, or acceptance failures."

research_report_v1_handoff:
  completed:
    - "PR #130 — Research Report v1 structured contract and validation — merged to main."
    - "PR #131 — safe integration from completed ResearchQuestionResult-like sessions to Research Report v1 — merged to main."
    - "ResearchReport carries bottom line, dimension-specific conclusions, certainty plus rationale, support/counter-evidence IDs, directness, missing evidence, provider/degradation state, indexed-vs-new provenance, limitations, session ID, and research state."
    - "Validation rejects fabricated EvidenceRecord IDs, duplicate/overlapping evidence classifications, missing required dimensions, and omitted required qualifying/counter-evidence."
    - "Structured report generation is downstream of the existing narrative verification and Research ISA close gates; a report-generation failure cannot invalidate an otherwise verified base result."
  authoritative_code_paths:
    - "knowledge_engine_ai/copilot/research_report.py"
    - "knowledge_engine_ai/copilot/research_report_integration.py"
    - "knowledge_engine_ai/copilot/run_research_question.py"
    - "knowledge_engine_ai/research_case_benchmark.py"
    - "knowledge_engine_ai/research_case_query_plan.py"
  required_next_sequence:
    - "1. knowledge-engine-web: finish its Research Report v1 dependency/lock update and remove any temporary lock-generation tooling before opening the Web PR."
    - "2. Web: carry ResearchReportBuildResult through orchestration without scraping narrative prose for semantics."
    - "3. Web Layer 1: render answer first — bottom line, dimension-specific conclusion/certainty rows, certainty rationale, and the key missing-direct-evidence limitation."
    - "4. Web Layer 2: preserve inspectable evidence and methodology — citations, source/evidence detail, directness, positive vs null/counter-evidence, provider coverage/degradation, indexed-vs-acquired provenance, funnel/session state."
    - "5. Run Monster #79 through the deployed Ask path; record session ID, funnel, latency, provider state, promoted records, final ResearchState, citations, and every failed acceptance criterion."
    - "6. Fix failures without weakening grounding/provenance/release gates; repeat until the Monster report passes both deterministic checks and the manual readability/usefulness comparison."
    - "7. Only after Monster #79 passes: add cross-domain golden cases, then optimize latency while preserving evidence gates."
  nonnegotiable_invariants:
    - "Every substantive factual claim remains grounded/source-linked."
    - "Direct Monster/commercial-energy-drink evidence stays distinct from class-level energy-drink and indirect caffeine/coffee/soda evidence."
    - "Acute evidence cannot be presented as proof of chronic one-year effects."
    - "Null, contradictory, and qualifying evidence must be represented deliberately."
    - "Missing direct long-duration evidence is explicit and machine-readable."
    - "Certainty must have a traceable rationale or be unavailable with a reason."
    - "A polished report never bypasses citation, contradiction, coverage, grounding, or Research ISA close gates."
  done_when: "Research Report v1 is not complete until the deployed Monster #79 Ask run produces all required dimensions, exposes positive and null evidence plus direct/indirect boundaries and missing one-year evidence, resolves released factual claims to grounded evidence, and is manually judged at least as readable/useful as the scholarly-assistant baseline."

