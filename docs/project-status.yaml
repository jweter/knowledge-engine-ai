secondary_track:
  name: "General Question Research Loop v1 (issue #69)"
  roadmap_file: "docs/roadmap/general_question_research_loop_v1.md"
  note: "A separate, cross-repo-coordinated track from current_milestone above (federated_discovery_orchestration_adoption.md/AI-FRD-5) -- both are active; this session worked the #69 track specifically because knowledge-engine-core's GQR-2 continuation (pmid/arxiv_id-at-ingestion) is still an open, intentionally-draft PR upstream, so no CORE-GQR-3/GQR-4-dependent work could safely start, but Core's ke general-question-acquisition-plan command (CORE-GQR-1/GQR-2) already shipped on Core's main independently of that draft PR and was genuinely unblocked."
  action_2026_08_23: "Added the first ke_client wrapper for Core's ke general-question-acquisition-plan command: general_question_acquisition_plan() in knowledge_engine_ai/ke_client.py, following the same subprocess/parse pattern as federated_discover/citation_snowball (writes the request to a temp JSON file since this Core command takes a file argument rather than flags, writes/reads --output the same way the other wrappers do), plus typed GeneralQuestionAcquisitionPlanResult/GeneralQuestionAcquisitionItem/GeneralQuestionAcquisitionIdentity dataclasses and a parse_general_question_acquisition_plan_result() parser. 12 new tests in tests/test_ke_client.py (437 total, 425 pre-existing plus 12 new); full local quality gate (ruff format --check, ruff check, mypy, pytest, pip-audit, git diff --check) passed via scripts/preflight.py. Deliberately just the subprocess/parse boundary: nothing calls this wrapper yet -- it is not wired into run_research_question, discovery_policy.py, or any CLI command, and nothing decides candidate selection or when to invoke it. docs/roadmap/general_question_research_loop_v1.md's GQR-3 checklist updated to reflect this and to name what remains (Core's own CORE-GQR-3 acquisition routing and CORE-GQR-4 persist/parse, both not started, both out of scope for this repository). No schema change; knowledge-engine-web unaffected."
  action_2026_08_23_continuation: "Second slice, same day, re-verified live repository/PR state first per this file's own selection_rule (knowledge-engine-core's main was unchanged since the prior action above; still no CORE-GQR-3/GQR-4). Closed the concrete gap the prior action's note left open -- 'nothing decides candidate selection or when to invoke it' -- inside copilot/discovery_policy.py rather than a new module, since that is where AI-FRD-3/AI-FRD-4's own analogous when-to-call decisions already live. FederatedDiscoveryPolicy gained enable_acquisition_plan (default False -- a deliberately different default than enable_federated_discovery/enable_citation_snowball's True, since no caller has opted a real session into this newer GQR-track capability yet) plus four bound fields. evaluate_and_run_discovery_augmentation gained a new private step, _maybe_run_acquisition_plan(), that runs immediately after federated discovery: when enabled and a federated-discovery result with candidates exists (and a research_question_id is available), it calls general_question_acquisition_plan() with that run's own search_run_id and deduplicated, capped candidate IDs; otherwise it records exactly why it did not (disabled, no federated result, no candidates, or no research_question_id), never guessing. Recorded as its own acquisition_plan ResearchEvent either way (source_ids left empty -- a plan is still not an Evidence Record), and surfaced on the existing DiscoveryAugmentationResult (four new fields: acquisition_plan/.acquisition_plan_error/.acquisition_plan_attempted/.acquisition_plan_skipped_reason), reachable end-to-end via ResearchQuestionResult.discovery -- no run_research_question.py code change needed, only a docstring note, since it already forwards the whole DiscoveryAugmentationResult unchanged. 12 new tests in tests/copilot/test_discovery_policy.py (449 total, 437 pre-existing plus 12 new); full local quality gate (ruff format --check, ruff check, mypy, pytest, pip-audit, git diff --check) passed via scripts/preflight.py. Still deliberately incomplete: no caller turns enable_acquisition_plan on for a real session yet (same open product/policy question as AI-FRD-5's mint_next_version caller), and even when it is turned on, nothing downstream acts on an eligible_full_text disposition -- Core's CORE-GQR-3 and PMC CORE-GQR-4 are merged; other route executors and grounded extraction/promotion remain open, so this is still bounded to a resolved plan, never an actual acquisition. No schema change; knowledge-engine-web unaffected (no caller opts in). docs/roadmap/general_question_research_loop_v1.md's GQR-3 checklist and CHANGELOG.md updated in this same change."
  action_2026_08_24: "Core CORE-GQR-3 and the PMC portion of CORE-GQR-4 are now merged upstream. Added GeneralQuestionAcquisitionItem.acquisition_route plus ke_client.general_question_acquire_pmc(), an explicit wrapper that strictly preserves Paper/ImportRun/ImportItem receipt lineage. It remains unwired: existing callers download nothing, and acquired Papers are not Evidence Records before grounded extraction, validation, and re-retrieval. Other route executors and CORE-GQR-5 remain future work."

