next_continuation:
  priority: "P5-highest-value-authorized-roadmap"
  action: "This session (2026-08-22, later still than the DOI-crosswalk session) implemented item (1) of the prior next_continuation, and only that item, per this repository's 'at most one substantial new roadmap implementation per run' policy: the invalidates-versus-qualifies trigger. copilot/research_freshness.py gained apply_narrative_touching_flips(session_repository, touching_flips, *, session_id, now=None) -> NarrativeFreshnessTriggerResult. For each NarrativeTouchingFlip whose flip.flag is retracted/withdrawn (invalidating), it calls SessionRepository.record_narrative_invalidation() -- but reads session.narrative_invalidated_at first and only calls the repository method when it is still None, so a batch containing more than one invalidating flip, or a call against a session an earlier pass already invalidated, returns already_invalidated=True instead of raising NarrativeAlreadyInvalidatedError. For each flip whose flag is corrected/expression_of_concern (qualifying), nothing is persisted -- it is returned in the result's qualifying tuple for an immediate caller to act on, since the AnswerFreshness projection that would track a durable pending_flips list does not exist yet. An unrecognized flag raises ValueError; an empty touching_flips input is a no-op that does not even require session_id to name an existing session (no invalidating flip means no SessionRepository read is needed at all). The appended narrative_invalidated ResearchEvent's notes name the specific canonical_id/doi/flag/cited_evidence_record_ids of the flip that triggered it, matching close_gate.py's own deterministic_policy event-notes convention. 12 new tests (tests/copilot/test_research_freshness.py), 397 total pass (385 pre-existing + 12 new); full local quality gate (ruff format --check, ruff check, mypy, pytest, pip-audit, git diff --check) clean via scripts/preflight.py. This session did not touch run_research_question.py or orchestrator/close_gate.py, and deliberately did not implement the AnswerFreshness projection or the version-minting caller. knowledge-engine-web is unaffected -- it pins a specific knowledge-engine-ai git commit; this slice adds one new function, one new dataclass, and two new frozensets, changes no existing function's signature, and Web never calls research_freshness.py directly; no cross-repo action needed. Every mechanism AI-FRD-5's two remaining exit criteria need now exists and is tested in isolation. Next continuation, in order of dependency: (1) a caller that runs a real freshness check end to end for a real session -- fetches the session's own events/narrative from SessionRepository, calls ke_client.federated_discover_history()/federated_coverage_report(), composes assess_rerun_need -> diff_candidate_snapshots -> session_retrieval_dois -> crosswalk_publication_status_flips -> apply_narrative_touching_flips, and decides what to do with the result; this is also the natural place the still-open 'who/what triggers a freshness check and how often' product/policy question (a scheduled job, a person, a Web page load) gets answered, since a caller cannot be written without also deciding when it runs; (2) the AnswerFreshness read-side projection dataclass the design doc sketches, once (1) exists to populate its pending_flips/narrative_invalidated_at-consuming fields meaningfully; (3) a caller that mints a version-N+1 session (sets answer_version=prior+1/supersedes_session_id=prior.session_id at create_session time) and calls supersede_session() on the prior version once N+1 reaches COMPLETED -- per the design doc's 'Interaction with session close gates' section; (4) once (1)-(3) land, extend the discovery_coverage ISA criterion (or add a sibling one) to cover correction/retraction findings, not just provider-attempt success; (5) AI-FRD-3/AI-FRD-4 wiring (discovery_policy.py)'s own next steps -- tune the conservative defaults against real traffic; (6) surfacing ResearchQuestionResult.discovery in Web remains Web-side work, not this repo's, and is not yet reachable in practice since Web's /ask does not pass a discovery_policy to run_research_question (a product-owner decision this repository does not make unilaterally, per discovery_policy.py's own docstring)."
  selection_rule: "Before beginning roadmap work, query live PR state. Handle failed, green, blocked, conflicted, or pending existing work according to docs/agent-development-policy.md and knowledge-engine-core's shared policy document."

