current_milestone:
  name: "Federated discovery orchestration adoption (AI-layer guidance)"
  roadmap_file: "docs/roadmap/federated_discovery_orchestration_adoption.md"
  state: "active -- AI-FRD-2's provider-coverage criterion now has a first bounded, tested slice; AI-FRD-5's rerun/diff reasoning has a first bounded, tested, unwired slice; its answer/session-versioning wiring is scoped in docs/roadmap/answer_session_versioning_design.md. That design's research_question_id-threading prerequisite, its repository-layer version-transition mechanics (ResearchSession.answer_version/supersedes_session_id/narrative_invalidated_at fields; SessionRepository.record_narrative_invalidation()/supersede_session()), its DOI-crosswalk detection layer (copilot/research_freshness.py's session_retrieval_dois()/crosswalk_publication_status_flips(), plus the additive ResearchEvent.source_dois field), its invalidates-versus-qualifies trigger (copilot/research_freshness.py's apply_narrative_touching_flips(), which calls record_narrative_invalidation() for a retracted/withdrawn touching flip, at most once per session, or returns a corrected/expression_of_concern one as a qualifying pending flip without persisting it), a real end-to-end caller for one session (`ke-ai session-freshness SESSION_ID`, read-only by default, `--apply` persists an invalidating flip), and, this session, the AnswerFreshness read-side projection (copilot/research_freshness.py's AnswerFreshness/build_answer_freshness(), reported by every ke-ai session-freshness run) are all now implemented and tested. Every mechanism the design doc's two AI-FRD-5 exit criteria need is now built, tested, and reachable end to end for a real session on demand; what remains is a caller that mints a version-N+1 session against run_research_question/a Research Session, and the still-open product/policy question of who/what invokes session-freshness and how often"
  objective: "Let Research Copilot plan bounded federated-discovery requests to Core rather than calling provider APIs directly, without ever treating provider count as evidence quality."
  known_gap: "AI-FRD-3/AI-FRD-4 wiring (discovery_policy.py) closed 2026-08-19 (see CHANGELOG.md). 2026-08-21 implemented AI-FRD-5's first exit criterion (copilot/research_freshness.py, `ke-ai research-freshness`; see CHANGELOG.md). 2026-08-22 implemented AI-FRD-2's first exit criterion (`discovery_coverage` ISA criterion), then the answer/session-versioning mechanics, DOI crosswalk, invalidates-versus-qualifies trigger, a real end-to-end `ke-ai session-freshness` caller, and, this session, the AnswerFreshness read-side projection those all feed (see CHANGELOG.md and docs/roadmap/answer_session_versioning_design.md for the full account). AI-FRD-2's remaining exit criteria (contradiction-search and citation-integrity criteria already exist independently as `contradiction_review`/`citation_integrity`; a correction/retraction close-gate criterion needs AI-FRD-5's rerun/diff reasoning wired into a session first) remain future work, same as AI-FRD-5's own remaining exit criterion (prior answer text versioned rather than silently overwritten, i.e. a caller that mints a version-N+1 session and calls supersede_session()), which requires a durable Research Session to attach the reasoning to and remains deliberately unstarted."

