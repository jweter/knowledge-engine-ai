secondary_track:
  name: "General Question Research Loop v1 (issue #69)"
  roadmap_file: "docs/roadmap/general_question_research_loop_v1.md"
  note: "A separate, cross-repo-coordinated track from current_milestone above. Core now owns deterministic acquisition routing and provider execution while AI owns orchestration and research-state derivation; acquired Papers remain non-evidence until Core grounded extraction/promotion and re-retrieval complete."
  action_2026_08_23: "Added the first ke_client wrapper for Core's ke general-question-acquisition-plan command: general_question_acquisition_plan() in knowledge_engine_ai/ke_client.py, following the same subprocess/parse pattern as federated_discover/citation_snowball, plus typed GeneralQuestionAcquisitionPlanResult/GeneralQuestionAcquisitionItem/GeneralQuestionAcquisitionIdentity dataclasses and a strict parser. The wrapper is bounded to planning and preserves Core's authority boundary."
  action_2026_08_23_continuation: "Added opt-in acquisition-plan orchestration in copilot/discovery_policy.py. FederatedDiscoveryPolicy.enable_acquisition_plan defaults False and, when explicitly enabled, requests a bounded plan only for the triggered federated-discovery run's own deduplicated candidates. The plan is recorded as a ResearchEvent but never treated as EvidenceRecord authority."
  action_2026_08_24: "Core CORE-GQR-3 and the PMC portion of CORE-GQR-4 are now merged upstream. Added GeneralQuestionAcquisitionItem.acquisition_route plus ke_client.general_question_acquire_pmc(), an explicit wrapper that strictly preserves Paper/ImportRun/ImportItem receipt lineage. It remains unwired: existing callers download nothing, and acquired Papers are not Evidence Records before grounded extraction, validation, and re-retrieval. Other route executors and CORE-GQR-5 remain future work."
  action_2026_08_25: "Implemented the dependency-safe GQR-1 AI research-state contract: stable ResearchState values, deterministic derivation from indexed retrieval/discovery/acquisition-plan/provider/close-gate facts, versioned JSON serialization, and regression coverage. Discovery candidates remain leads and a triggered weak-coverage session cannot be mislabeled indexed_answer. The synchronous pipeline reserves researching for the later durable asynchronous acquisition/extraction workflow rather than fabricating progress."
  action_2026_08_27: "Issue #79 now has the first deterministic GQR golden research-case scaffold in knowledge_engine_ai/research_case_benchmark.py. It keeps the existing reviewed-EvidenceRecord retrieval benchmark separate, encodes Zero Ultra vs Original exposures, acute/chronic/incident-hypertension/measurement dimensions, required search tracks, all issue-seeded PMIDs as discovery targets, explicit null/counter-evidence targets, scholarly-provider coverage, long-term evidence-gap disclosure, claim-linking and inference guards, plus focused tests and documentation. Discovery seeds remain non-evidence and no preferred scientific conclusion is encoded."
  action_2026_08_27_gqr2: "Implemented the first deterministic GQR-2 query-plan compiler slice in knowledge_engine_ai/general_query_plan.py plus the issue #79 golden fixture in research_case_query_plan.py. The plan is versioned and inspectable, bounds concepts/synonyms/tracks/query counts and query length, preserves at least one canonical query per track before round-robin synonym expansion, supports explicit direct/class/indirect/guidance/counterevidence scopes, keeps PICO opt-in rather than forcing it on unrelated domains, and carries issue #79 answer dimensions plus PMID seed identities as non-evidence search artifacts."

