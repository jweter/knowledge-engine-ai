current_milestone:
  name: "Federated discovery orchestration adoption (AI-layer guidance)"
  roadmap_file: "docs/roadmap/federated_discovery_orchestration_adoption.md"
  state: "active -- AI-FRD-2's provider-coverage criterion now has a first bounded, tested slice; AI-FRD-5's rerun/diff reasoning has a first bounded, tested, unwired slice; its answer/session-versioning wiring is scoped in docs/roadmap/answer_session_versioning_design.md. That design's research_question_id-threading prerequisite, its repository-layer version-transition mechanics (ResearchSession.answer_version/supersedes_session_id/narrative_invalidated_at fields; SessionRepository.record_narrative_invalidation()/supersede_session()), its DOI-crosswalk detection layer (copilot/research_freshness.py's session_retrieval_dois()/crosswalk_publication_status_flips(), plus the additive ResearchEvent.source_dois field), its invalidates-versus-qualifies trigger (copilot/research_freshness.py's apply_narrative_touching_flips(), which calls record_narrative_invalidation() for a retracted/withdrawn touching flip, at most once per session, or returns a corrected/expression_of_concern one as a qualifying pending flip without persisting it), a real end-to-end caller for one session (`ke-ai session-freshness SESSION_ID`, read-only by default, `--apply` persists an invalidating flip), its read-side projection (`AnswerFreshness`/`build_answer_freshness()`, `SessionRepository.list_sessions_for_research_question()`, both wired into `ke-ai session-freshness`'s own text/JSON output), and the version-minting caller (`copilot/research_freshness.py`'s `mint_next_version()`, plus `run_research_question`'s additive `answer_version`/`supersedes_session_id` keyword parameters) are all implemented and tested. Every mechanism both of AI-FRD-5's remaining exit criteria need is built and tested; what remains for both criteria is the still-open product/policy question of who/what invokes session-freshness/version-minting and how often -- no scheduled or automatic caller exists yet for either."
  objective: "Let Research Copilot plan bounded federated-discovery requests to Core rather than calling provider APIs directly, without ever treating provider count as evidence quality."
  known_gap: "AI-FRD-3/AI-FRD-4 wiring (discovery_policy.py) closed 2026-08-19 (see CHANGELOG.md). 2026-08-21 implemented AI-FRD-5's first exit criterion (copilot/research_freshness.py, `ke-ai research-freshness`; see CHANGELOG.md). 2026-08-22 implemented AI-FRD-2's first exit criterion, the AnswerFreshness read-side projection, and the version-minting caller (`mint_next_version()`): given a COMPLETED, thread-tracked prior session, it re-runs `run_research_question` as version N+1 of the same research_question_id thread and, only on a COMPLETED outcome, supersedes the prior version -- never on a BLOCKED outcome, per the design doc's 'a degraded re-verification attempt must never demote a still-good prior answer' rule. No caller yet invokes `mint_next_version()` for a real session -- that, and the still-undecided who/what/how-often policy question, remain this milestone's own next continuation. AI-FRD-2's remaining exit criteria (contradiction-search and citation-integrity criteria already exist independently as `contradiction_review`/`citation_integrity`; a correction/retraction close-gate criterion needs AI-FRD-5's rerun/diff reasoning wired into a session first) remain future work."

