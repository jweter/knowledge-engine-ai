current_milestone:
  name: "Federated discovery orchestration adoption (AI-layer guidance)"
  roadmap_file: "docs/roadmap/federated_discovery_orchestration_adoption.md"
  state: "active -- AI-FRD-5's rerun/diff reasoning has a first bounded, tested, unwired slice, and its answer/session-versioning wiring is now scoped in docs/roadmap/answer_session_versioning_design.md; next continuation is implementing that design against run_research_question/a Research Session"
  objective: "Let Research Copilot plan bounded federated-discovery requests to Core rather than calling provider APIs directly, without ever treating provider count as evidence quality."
  known_gap: "AI-FRD-3/AI-FRD-4 wiring (discovery_policy.py) closed 2026-08-19 (see CHANGELOG.md). This session (2026-08-21) implemented AI-FRD-5's first exit criterion: copilot/research_freshness.py's assess_rerun_need() (deterministic: no run ever recorded, or the most recent run incomplete, or older than a configurable freshness threshold) and diff_candidate_snapshots() (newly discovered candidates and newly asserted retraction/correction/expression-of-concern/withdrawal flags between two past runs' full candidate snapshots, by Core's canonical_id) -- both pure functions over data federated_discover_history()/federated_coverage_report() already return, no new Core change or subprocess call shape. New `ke-ai research-freshness <research_question_id>` CLI command is the first caller, mirroring AI-FRD-3/AI-FRD-4's own 'tested primitive, then a standalone CLI caller, wire into run_research_question later' sequencing. Live-verified against the real `ke` binary: a ledger was seeded via Core's own FederatedSearchLedger.record() with two runs for one tracked question (an older run with one clear candidate, a newer run with that candidate now retracted plus one brand-new candidate), and `ke-ai research-freshness` correctly reported both through the real subprocess boundary, in both --format text and --format json. 345 tests pass (325 pre-existing plus 20 new); full local quality gate (ruff format --check, ruff check, mypy, pytest, pip-audit, git diff --check) passed. AI-FRD-5's remaining two exit criteria (corrections/retractions invalidating or qualifying prior synthesis; prior answer text versioned rather than silently overwritten) require a durable Research Session to attach this reasoning to and remain deliberately unstarted -- this slice is reasoning over discovery-run history only, not synthesis or session state."

