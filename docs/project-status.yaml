next_continuation:
  priority: "P5-highest-value-authorized-roadmap"
  action: "This session (2026-08-22) added docs/roadmap/answer_session_versioning_design.md, the explicit scoping/design doc AI-FRD-5's remaining wiring depends on -- docs only, no code changed. It defines: a version is one whole ResearchSession (never a second synthesis event folded into an existing session), linked by three new additive ResearchSession fields (research_question_id thread key, answer_version, supersedes_session_id); how assess_rerun_need()/diff_candidate_snapshots() outputs map onto a version transition via a DOI crosswalk from a flagged federated-discovery candidate to the evidence_record_ids a prior narrative actually cited; an invalidates (retracted/withdrawn) versus qualifies (corrected/expression_of_concern) split; and why SessionStatus.SUPERSEDED (already in the enum, unused anywhere in code today) is the right terminal state for an old version once -- and only once -- its replacement reaches COMPLETED. Next continuation, in order of dependency: (1) implement this design against run_research_question.py/sessions/models.py/sessions/repository.py/orchestrator/close_gate.py -- the additive schema fields, the answer_superseded ResearchEvent, and the DOI crosswalk -- closing AI-FRD-5's own remaining two exit criteria (this is now unblocked by (2) below, not still pending it); (2) [closed by this session] the answer/session-versioning scoping this milestone needed before that implementation could start; (3) AI-FRD-3/AI-FRD-4 wiring (discovery_policy.py)'s own next steps -- tune the conservative defaults against real traffic; (4) AI-FRD-2 coverage-aware Research ISA remains not started; (5) surfacing ResearchQuestionResult.discovery in Web remains Web-side work, not this repo's, and is not yet reachable in practice since Web's /ask does not pass a discovery_policy to run_research_question (opting Web's existing /ask traffic into autonomous federated-discovery cost/latency is a product-owner decision this repository does not make unilaterally, per discovery_policy.py's own docstring)."
