next_continuation:
  priority: "P5-highest-value-authorized-roadmap"
  action: "This session (2026-08-22, later still) implemented the repository-layer half of docs/roadmap/answer_session_versioning_design.md: ResearchSession gained its three remaining additive fields (answer_version default 1, supersedes_session_id, narrative_invalidated_at) with a guarded ALTER TABLE migration in sessions/repository.py::_migrate_schema (following the existing research_question_id precedent), and SessionRepository gained record_narrative_invalidation() (appends a narrative_invalidated ResearchEvent, sets narrative_invalidated_at once, raises the new NarrativeAlreadyInvalidatedError on a second call) and supersede_session() (appends an answer_superseded ResearchEvent, flips status to SessionStatus.SUPERSEDED, raises the new SessionNotSupersedableError unless the session is currently COMPLETED). 13 new tests (tests/sessions/test_repository.py), 371 total pass (358 pre-existing + 13 new); full local quality gate (ruff format --check, ruff check, mypy, pytest, pip-audit, git diff --check) clean via scripts/preflight.py. Deliberately the 'mechanics' half only, matching this repository's own staged-delivery pattern (the same way AI-FRD-5's rerun/diff reasoning landed standalone before any wiring): nothing calls either new method yet, and this session did not touch run_research_question.py, orchestrator/close_gate.py, or copilot/research_freshness.py. knowledge-engine-web is unaffected -- it pins a specific knowledge-engine-ai git commit and only uses the pre-existing SessionRepository/run_research_question call shapes, both unchanged; no cross-repo action needed for this slice. Next continuation, in order of dependency: (1) the DOI crosswalk (copilot/research_freshness.py or a new module): for each PublicationStatusFlip in diff_candidate_snapshots' output, resolve its canonical_id's doi, match against a session's own retrieval-step RetrievedPaper DOIs, and check whether the matching evidence_record_id was actually cited in the session's persisted narrative (verification.py's existing CITATION_PATTERN) -- the design doc's own 'the crosswalk' section names RetrievedPaper.doi persistence as a real, open sub-decision this PR must make (re-run ke evidence-report at check time, or add an additive doi field alongside the retrieval event's existing source_ids); (2) the invalidates-versus-qualifies trigger that, once the crosswalk finds a real hit, calls record_narrative_invalidation() (invalidates: retracted/withdrawn) or records a qualifying pending_flip (corrected/expression_of_concern) without calling it; (3) the AnswerFreshness read-side projection dataclass the design doc sketches; (4) a caller that mints a version-N+1 session (sets answer_version=prior+1/supersedes_session_id=prior.session_id at create_session time) and calls supersede_session() on the prior version once N+1 reaches COMPLETED -- likely a new function in copilot/, not a change to run_research_question's own signature, per the design doc's 'Interaction with session close gates' section; (5) once (1)-(4) land, extend the discovery_coverage ISA criterion (or add a sibling one) to cover correction/retraction findings, not just provider-attempt success; (6) AI-FRD-3/AI-FRD-4 wiring (discovery_policy.py)'s own next steps -- tune the conservative defaults against real traffic; (7) surfacing ResearchQuestionResult.discovery in Web remains Web-side work, not this repo's, and is not yet reachable in practice since Web's /ask does not pass a discovery_policy to run_research_question (a product-owner decision this repository does not make unilaterally, per discovery_policy.py's own docstring). Note: 'who/what triggers a freshness check and how often' remains explicitly undecided product/policy work per the design doc's own 'What this does not do' section -- not this repository's call to make unilaterally; a future session should treat (1)-(3) (the detection mechanism) as separable from that policy decision, the same way this session kept the mechanics separable from wiring."
