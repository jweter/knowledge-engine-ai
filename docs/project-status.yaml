next_continuation:
  priority: "P5-highest-value-authorized-roadmap"
  action: "This session (2026-08-22) implemented AI-FRD-2's first exit criterion: the optional `discovery_coverage` ISA criterion (see current_milestone.known_gap above). The same session separately added docs/roadmap/answer_session_versioning_design.md, the explicit scoping/design doc AI-FRD-5's remaining wiring depends on -- docs only, no code changed -- closing the scoping gap this session's own AI-FRD-2 action note had flagged as needed before that wiring could be built. The same session's automated review (chatgpt-codex-connector, PR #60) then found three concrete gaps in that first draft, which this session's follow-up commit closed, still docs-only: (a) research_question_id was never actually threaded from run_research_question through discovery_policy.py's _run_federated_discovery/execute_discovery_plan into the federated_discover() call that already accepts it -- the doc now specifies the parameter's caller-supplied-or-derived origin and the exact call chain it threads through; (b) a session left at COMPLETED with an invalidating retraction detected but its replacement still BLOCKED (or not yet attempted) had no way to stop reading as releaseable -- the doc now adds a fourth additive field, narrative_invalidated_at, and a two-field releaseability check independent of any replacement's state; (c) a session with no originating discovery run had no snapshot to diff against on its first freshness check, so a retraction on its citations could never surface via the diff mechanism -- the doc now adopts a first-federated-discover-run-is-the-baseline rule plus a first-seen status-assertion fallback against that baseline snapshot directly. It defines: a version is one whole ResearchSession (never a second synthesis event folded into an existing session), linked by four new additive ResearchSession fields (research_question_id thread key, answer_version, supersedes_session_id, narrative_invalidated_at); how assess_rerun_need()/diff_candidate_snapshots() outputs map onto a version transition via a DOI crosswalk from a flagged federated-discovery candidate to the evidence_record_ids a prior narrative actually cited; an invalidates (retracted/withdrawn) versus qualifies (corrected/expression_of_concern) split; and why SessionStatus.SUPERSEDED (already in the enum, unused anywhere in code today) is the right terminal state for an old version once -- and only once -- its replacement reaches COMPLETED. Next continuation, in order of dependency: (1) implement this design against run_research_question.py/sessions/models.py/sessions/repository.py/orchestrator/close_gate.py/copilot/discovery_policy.py/discovery_plan.py -- the additive schema fields, the answer_superseded/narrative_invalidated ResearchEvents, the research_question_id threading, and the DOI crosswalk -- closing AI-FRD-5's own remaining two exit criteria (this is now unblocked by (2) below, not still pending it); (2) [closed by this session] the answer/session-versioning scoping this milestone needed before that implementation could start, including its reviewer-identified gaps; (3) once (1) lands, extend the discovery_coverage criterion (or add a sibling one) to cover correction/retraction findings, not just provider-attempt success; (4) AI-FRD-3/AI-FRD-4 wiring (discovery_policy.py)'s own next steps -- tune the conservative defaults against real traffic; (5) surfacing ResearchQuestionResult.discovery in Web remains Web-side work, not this repo's, and is not yet reachable in practice since Web's /ask does not pass a discovery_policy to run_research_question (opting Web's existing /ask traffic into autonomous federated-discovery cost/latency is a product-owner decision this repository does not make unilaterally, per discovery_policy.py's own docstring)."
  selection_rule: "Before beginning roadmap work, query live PR state. Handle failed, green, blocked, conflicted, or pending existing work according to docs/agent-development-policy.md and knowledge-engine-core's shared policy document."

