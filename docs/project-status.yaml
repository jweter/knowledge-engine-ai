current_milestone:
  name: "Federated discovery orchestration adoption (AI-layer guidance)"
  roadmap_file: "docs/roadmap/federated_discovery_orchestration_adoption.md"
  state: "active, wiring done -- next continuation is live-traffic tuning of the conservative defaults"
  objective: "Let Research Copilot plan bounded federated-discovery requests to Core rather than calling provider APIs directly, without ever treating provider count as evidence quality."
  known_gap: "CLOSED this session. AI-FRD-3 (Discovery-plan compiler) and AI-FRD-4 (citation-snowball planner) are now both wired into run_research_question's own planning via a new opt-in knowledge_engine_ai/copilot/discovery_policy.py (FederatedDiscoveryPolicy, evaluate_and_run_discovery_augmentation()). Trigger policy: a deterministic coverage-gap rule (deduplicated evidence-record coverage below a configurable threshold, default 3) fires federated discovery; the same signal fires citation-snowball, seeded from the primary retrieval branch's own ranked papers' DOIs (default cap 3 seeds). Both are opt-in -- discovery_policy defaults to None on run_research_question, reproducing prior behavior exactly, per docs/agent-development-policy.md section 2's cost-consciousness rule. Provenance preserved end to end via durable ResearchEvents and the new ResearchQuestionResult.discovery field; candidates are never written to source_ids, never fed to synthesis, never treated as EvidenceRecords. New CLI surface: research --broaden-search-on-gap --discovery-ledger-root <dir>. Every numeric default (coverage threshold, provider/seed limits, execution-second ceilings) is a conservative, documented, overridable FederatedDiscoveryPolicy field -- Jeremy's product-owner decision authorized building and wiring the capability ('continue with the FRD and widen the search'), not any specific number, so each default is called out in the introducing PR's description as overridable."

