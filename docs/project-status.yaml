schema_version: 1
project: knowledge-engine-ai
updated_at: "2026-08-19T10:30:00Z"
status_source: "Verified repository state plus docs/roadmap/future_ai_orchestration_plan.md; this file is a continuity cache and never overrides higher-authority evidence."

product:
  primary_surface: "Python library: the judgment/orchestration layer over knowledge-engine-core's evidence graph"
  role_in_family: "owns the one supported subprocess boundary (ke_client.py) for invoking Core's `ke` CLI; consumed by knowledge-engine-web as a dependency"
  research_copilot_status: "AI-O12-O17 web integration wiring complete (run_research_question composed, wired into Web's /ask, guardrails, live-verified); AI-O10 Discovery Intelligence and AI-O11 Hypothesis/Experiment Assistance not started (both explicitly gated on analytical/graph prerequisites)"

current_milestone:
  name: "Federated discovery orchestration adoption (AI-layer guidance)"
  roadmap_file: "docs/roadmap/federated_discovery_orchestration_adoption.md"
  state: "active, early"
  objective: "Let Research Copilot plan bounded federated-discovery requests to Core rather than calling provider APIs directly, without ever treating provider count as evidence quality."
  known_gap: "ke-ai discover is the first in-repository caller of ke_client.federated_discover(); deliberately a standalone CLI command, not wired into run_research_question's own planning. AI-FRD-3 (Discovery-plan compiler) has its foundation now (discovery_plan.py): a validated DiscoveryPlan and a bounded execute_discovery_plan() that runs it through the same ke_client boundary and returns Core's own search_run_id. Nothing calls this compiler yet except tests -- wiring it into run_research_question's own planning, and the policy for deciding when to invoke it, remains open. AI-FRD-4 (citation-snowball planner) now has its own ke_client wrapper (citation_snowball(), this session -- see PR) mirroring federated_discover()'s shape, but no CLI caller and no seed-selection policy yet -- the same shape AI-FRD-3 was in before ke-ai discover was added."

automation_contract:
  schedule_role: "repository participant in an hourly portfolio-development loop (owner-managed; not created by this session)"
  new_roadmap_pr_budget_per_run: 1
  query_live_github_state_every_run: true
  newly_opened_pr_requires_fresh_ci_before_merge: true
  draft_prs: "never"
  merge_method: "squash"
  required_pr_workflows:
    - name: "Quality"
      file: ".github/workflows/quality.yml"
      job: "checks"
      note: "ruff format --check, ruff check, mypy, pytest"
  non_required_workflows:
    - name: "Golden Retrieval Baseline"
      file: ".github/workflows/golden-retrieval-baseline.yml"
      note: "workflow_dispatch only -- never runs automatically on a PR, not a required check"
  advisory_review_unavailable_is_not_failure: true

verified_repository_state:
  checked_at: "2026-08-19T09:15:00Z"
  note: "Live PR/check/issue state is intentionally not cached as authoritative counts here. Scheduled runs must query GitHub directly before acting."
  open_prs: 0
  ci_workflows:
    - ".github/workflows/quality.yml"
    - ".github/workflows/golden-retrieval-baseline.yml"

next_continuation:
  priority: "P5-highest-value-authorized-roadmap"
  action: "This session opened a PR adding FederatedDiscoveryResult.search_run_created_at, parsing Core's already-documented `coverage.created_at` field (docs/core_interface_contract.md) that this repository's parser previously ignored -- half of knowledge-engine-web's WEB-FRD-2 gap (the other half, rendering it in discover.html and bumping Web's pinned AI revision, is Web's own follow-up once this PR merges to main, the same two-step pattern already used for WEB-FRD-3/WEB-FRD-4). Purely additive; no existing field or consumer behavior changed. Separately unresolved: AI-FRD-4's own next continuation is either (a) add a standalone `ke-ai citation-snowball` CLI command, mirroring how AI-FRD-3's ke-ai discover closed the same built-but-unreachable gap for federated_discover, or (b) decide the policy for when a Research Session should run a snowball and from which seeds. AI-FRD-3's own remaining work is also still open: decide the policy for when a Research Session should compile and execute a DiscoveryPlan (vs. searching only the local corpus), and call execute_discovery_plan() from run_research_question's own planning path."
  selection_rule: "Before beginning roadmap work, query live PR state. Handle failed, green, blocked, conflicted, or pending existing work according to docs/agent-development-policy.md and knowledge-engine-core's shared policy document."

human_decision_required: null

maintenance_contract:
  verify_every_scheduled_run: true
  update_when_project_reality_changes: true
  update_in_same_pr_as_relevant_change: true
  stale_status_is_a_defect: true
  timestamp_age_alone_requires_noop_pr: false
