next_continuation:
  priority: "P5-highest-value-authorized-roadmap"
  action: "This session (2026-08-22, later still than the repository-mechanics session) implemented the DOI-crosswalk detection layer of docs/roadmap/answer_session_versioning_design.md -- item (1) of the prior next_continuation, and only that item, per this repository's 'at most one substantial new roadmap implementation per run' policy. copilot/research_freshness.py gained session_retrieval_dois() (builds an evidence_record_id -> doi mapping from a session's own retrieval-step ResearchEvents) and crosswalk_publication_status_flips() (for each PublicationStatusFlip: look up its candidate's doi in the current coverage snapshot, match against the session's own retrieval dois, keep only matches actually cited in the session's persisted narrative via verification.py's existing CITATION_PATTERN -- returns a new NarrativeTouchingFlip per real hit). Both are pure, deterministic, take already-fetched data, and do not call SessionRepository or ke themselves, matching assess_rerun_need/diff_candidate_snapshots' own shape. Resolved the design doc's own named open sub-decision (re-run ke evidence-report at check time, vs. an additive doi field alongside source_ids): chose the additive field, ResearchEvent.source_dois (sessions/models.py, parallel to source_ids, same order, same additive/no-schema-bump precedent as duration_ms), populated by both retrieval-step events in orchestrator/workflow.py's new _evidence_record_dois() helper, with a guarded ALTER TABLE migration for research_events in sessions/repository.py::_migrate_schema. Rejected the re-run option because it answers 'what would retrieval see today,' not 'what did this session's retrieval step actually see' -- and a corpus that changed since the session ran (the exact scenario a freshness check exists to detect) can make a re-run return different papers, undermining the citation match this crosswalk depends on. 14 new tests (tests/sessions/test_repository.py, tests/test_orchestrator_workflow.py, tests/copilot/test_research_freshness.py), 385 total pass (371 pre-existing + 14 new); full local quality gate (ruff format --check, ruff check, mypy, pytest, pip-audit, git diff --check) clean via scripts/preflight.py. This session did not touch run_research_question.py or orchestrator/close_gate.py, and deliberately did not implement items (2)-(4) below. knowledge-engine-web is unaffected -- it pins a specific knowledge-engine-ai git commit; this slice adds only new functions and additive fields/columns, changes no existing function's required signature (workflow.py's _record_step gained one new optional keyword-only arg with a () default), and Web never calls research_freshness.py or workflow.py's private helpers directly; no cross-repo action needed. Next continuation, in order of dependency: (1) the invalidates-versus-qualifies trigger that, for a real session, calls crosswalk_publication_status_flips() and then, for each returned NarrativeTouchingFlip, calls record_narrative_invalidation() when flip.flag is retracted/withdrawn (invalidates) or records a qualifying pending_flip when flip.flag is corrected/expression_of_concern (qualifies) without calling it -- likely a new function in copilot/, reading a session's own events/narrative plus a fresh diff_candidate_snapshots() result, not a change to run_research_question's own signature; (2) the AnswerFreshness read-side projection dataclass the design doc sketches, once (1) exists to populate its pending_flips/narrative_invalidated_at-consuming fields meaningfully; (3) a caller that mints a version-N+1 session (sets answer_version=prior+1/supersedes_session_id=prior.session_id at create_session time) and calls supersede_session() on the prior version once N+1 reaches COMPLETED -- per the design doc's 'Interaction with session close gates' section; (4) once (1)-(3) land, extend the discovery_coverage ISA criterion (or add a sibling one) to cover correction/retraction findings, not just provider-attempt success; (5) AI-FRD-3/AI-FRD-4 wiring (discovery_policy.py)'s own next steps -- tune the conservative defaults against real traffic; (6) surfacing ResearchQuestionResult.discovery in Web remains Web-side work, not this repo's, and is not yet reachable in practice since Web's /ask does not pass a discovery_policy to run_research_question (a product-owner decision this repository does not make unilaterally, per discovery_policy.py's own docstring). Note: 'who/what triggers a freshness check and how often' remains explicitly undecided product/policy work per the design doc's own 'What this does not do' section -- not this repository's call to make unilaterally; a future session should treat (1)-(2) (the trigger and the read-side projection) as separable from that policy decision, the same way this session kept detection separable from the trigger."
  selection_rule: "Before beginning roadmap work, query live PR state. Handle failed, green, blocked, conflicted, or pending existing work according to docs/agent-development-policy.md and knowledge-engine-core's shared policy document."

