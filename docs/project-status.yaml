next_continuation:
  priority: "P5-highest-value-authorized-roadmap"
  action: "This session (2026-08-22, later still than the AnswerFreshness-projection session) implemented item (1) of the prior next_continuation, and only that item, per this repository's 'at most one substantial new roadmap implementation per run' policy: the version-minting caller. run_research_question gained two additive keyword parameters, answer_version (default 1) and supersedes_session_id (default None), set verbatim on the ResearchSession it creates -- same opt-in shape research_question_id already used, so every existing caller is unaffected. copilot/research_freshness.py gained mint_next_version(session_repository, prior_session_id, *, sources, evidence, llm, ...): it loads the prior session, requires it to be COMPLETED (raises SessionNotCompletedError otherwise) and to carry a research_question_id (raises MissingResearchQuestionIdError otherwise), then calls run_research_question a second time with the prior's own question text, the same research_question_id thread, answer_version=prior.answer_version + 1, and supersedes_session_id=prior_session_id. Only if that new run's own close_result.status reaches COMPLETED does it call SessionRepository.supersede_session() on the prior version (an explicit answer_superseded ResearchEvent plus the COMPLETED -> SUPERSEDED status flip); a new run that ends BLOCKED instead leaves the prior version exactly as it was -- COMPLETED, un-superseded -- per the design doc's 'Interaction with session close gates' (a degraded re-verification attempt must never demote a still-good prior answer). Returns VersionTransitionResult(new_result, superseded, supersede_event). 7 new tests (2 in tests/copilot/test_run_research_question.py exercising the new run_research_question parameters directly; 5 in tests/copilot/test_research_freshness.py::TestMintNextVersion covering the COMPLETED-supersedes-prior path, the BLOCKED-leaves-prior-alone path, and all three error preconditions), 425 total pass (418 pre-existing + 7 new); full local quality gate (ruff format --check, ruff check, mypy, pytest, pip-audit, git diff --check) passed via scripts/preflight.py. No SessionRepository/ke_client/ResearchSession/ResearchEvent schema change beyond what already shipped earlier this day -- knowledge-engine-web is unaffected (it pins a specific knowledge-engine-ai commit and never calls research_freshness.py or run_research_question directly); no cross-repo action needed, and none was required: this is a pure library addition inside knowledge-engine-ai's own copilot layer, with no new ke or CLI surface yet. Next continuation, in order of dependency: (1) a real caller that invokes mint_next_version() for an actual session -- no CLI command calls it yet (ke-ai session-freshness remains read-only plus its own --apply for invalidation only, and deliberately does not mint a version-N+1 session itself); (2) the still-open product/policy decision of who/what decides *when* to invoke session-freshness and/or mint_next_version, and how often (a scheduled job, a person, a Web page load) -- three sessions running now have deliberately left this manual/on-demand rather than guessing a policy; (3) once (1)-(2) land, extend the discovery_coverage ISA criterion (or add a sibling one) to cover correction/retraction findings, not just provider-attempt success; (4) AI-FRD-3/AI-FRD-4 wiring (discovery_policy.py)'s own next steps -- tune the conservative defaults against real traffic; (5) surfacing ResearchQuestionResult.discovery in Web remains Web-side work, not this repo's, and is not yet reachable in practice since Web's /ask does not pass a discovery_policy to run_research_question (a product-owner decision this repository does not make unilaterally, per discovery_policy.py's own docstring)."
  selection_rule: "Before beginning roadmap work, query live PR state. Handle failed, green, blocked, conflicted, or pending existing work according to docs/agent-development-policy.md and knowledge-engine-core's shared policy document."

