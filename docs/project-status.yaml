schema_version: 1
project: knowledge-engine-ai
updated_at: "2026-08-19T12:00:00Z"
status_source: "Verified repository state plus docs/roadmap/future_ai_orchestration_plan.md; this file is a continuity cache and never overrides higher-authority evidence."

product:
  primary_surface: "Python library: the judgment/orchestration layer over knowledge-engine-core's evidence graph"
  role_in_family: "owns the one supported subprocess boundary (ke_client.py) for invoking Core's `ke` CLI; consumed by knowledge-engine-web as a dependency"
  research_copilot_status: "AI-O12-O17 web integration wiring complete (run_research_question composed, wired into Web's /ask, guardrails, live-verified); AI-O10 Discovery Intelligence and AI-O11 Hypothesis/Experiment Assistance not started (both explicitly gated on analytical/graph prerequisites)"

current_milestone:
  name: "Federated discovery orchestration adoption (AI-layer guidance)"
  roadmap_file: "docs/roadmap/federated_discovery_orchestration_adoption.md"
  state: "active, early"
  objective: "Let Research Copilot plan bounded federated-discovery requests to Core rather than calling provider APIs directly, without ever treating provider count as evidence quality."
  known_gap: "ke-ai discover and ke-ai citation-snowball are both standalone CLI commands, deliberately not wired into run_research_question's own planning. AI-FRD-3 (Discovery-plan compiler) has its foundation now (discovery_plan.py): a validated DiscoveryPlan and a bounded execute_discovery_plan() that runs it through the same ke_client boundary and returns Core's own search_run_id. Nothing calls this compiler yet except tests -- wiring it into run_research_question's own planning, and the policy for deciding when to invoke it, remains open. AI-FRD-4 (citation-snowball planner) now has its own ke_client wrapper (citation_snowball()) and CLI caller (ke-ai citation-snowball, this session), the same shape federated_discover()/ke-ai discover reached -- no seed-selection policy or run_research_question wiring yet for either FRD-3 or FRD-4."

automation_contract:
  schedule_role: "repository participant in an hourly portfolio-development loop (owner-managed; not created by this session)"
  new_roadmap_pr_budget_per_run: 1
  query_live_github_state_every_run: true
  newly_opened_pr_requires_fresh_ci_before_merge: true
  draft_prs: "never"
  merge_method: "squash"
  required_pr_workflows:
    - name: "Quality"
      file: ".github/workflows/quality.yml"
      job: "checks"
      note: "ruff format --check, ruff check, mypy, pytest"
  non_required_workflows:
    - name: "Golden Retrieval Baseline"
      file: ".github/workflows/golden-retrieval-baseline.yml"
      note: "workflow_dispatch only -- never runs automatically on a PR, not a required check"
  advisory_review_unavailable_is_not_failure: true

verified_repository_state:
  checked_at: "2026-08-19T12:00:00Z"
  note: "Live PR/check/issue state is intentionally not cached as authoritative counts here. Scheduled runs must query GitHub directly before acting."
  open_prs: 0
  ci_workflows:
    - ".github/workflows/quality.yml"
    - ".github/workflows/golden-retrieval-baseline.yml"

next_continuation:
  priority: "P5-highest-value-authorized-roadmap"
  action: "This session opened a PR adding `ke-ai citation-snowball`, the first in-repository CLI caller of ke_client.citation_snowball() (AI-FRD-4), mirroring how ke-ai discover closed the same built-but-unreachable gap for federated_discover (AI-FRD-3). Purely additive; no existing command, field, or consumer behavior changed. Both AI-FRD-3 and AI-FRD-4 now stand at the same point: a working, tested, directly-callable CLI command, but no policy inside run_research_question deciding when to invoke either one, and no seed-selection policy for citation-snowball specifically. That policy decision is the next continuation for both sub-milestones and is a genuine product/research-design judgment call, not a mechanical wiring gap -- likely needs the project owner's input on when broader provider coverage or citation expansion is actually warranted during a Research Session. WEB-FRD-2 (search-run timestamp) is fully closed as of knowledge-engine-web PR #67 -- confirmed by reading Web's own repository state, not assumed from a prior cache."
  selection_rule: "Before beginning roadmap work, query live PR state. Handle failed, green, blocked, conflicted, or pending existing work according to docs/agent-development-policy.md and knowledge-engine-core's shared policy document."

human_decision_required: null

