next_continuation:
  priority: "P5-highest-value-authorized-roadmap"
  action: "This session (2026-08-22, later still than the invalidates-versus-qualifies trigger session) implemented item (1) of the prior next_continuation, and only that item, per this repository's 'at most one substantial new roadmap implementation per run' policy: a real end-to-end caller. cli.py gained the `session-freshness SESSION_ID --ledger-root DIR [--session-db PATH] [--apply] [--max-age-seconds N] [--format text|json]` command -- the first caller in this repository of the full AI-FRD-5 reasoning chain against an actual, durable ResearchSession rather than a bare research_question_id. It loads the named session via SessionRepository, reads session.research_question_id (reporting plainly and exiting 0 without error when unset -- a session predating the threading, or one that never triggered discovery), reads the session's own event log to find its most recent successful synthesis narrative and (via session_retrieval_dois()) its retrieval-step DOI map, calls ke_client.federated_discover_history()/assess_rerun_need() exactly as ke-ai research-freshness already does, and -- when at least two runs are recorded and a narrative exists -- fetches the two most recent runs' full snapshots, diffs them, and crosswalks the diff's newly_flagged candidates against the session's own cited narrative via crosswalk_publication_status_flips(). Every touching flip found is reported, split into invalidates (retracted/withdrawn) versus qualifies (corrected/expression_of_concern) using the same flag vocabulary apply_narrative_touching_flips() itself uses, but read-only by default: nothing is written to --session-db unless --apply is passed, in which case apply_narrative_touching_flips() is also called, persisting the first invalidating flip exactly as that function already guarantees (idempotent -- a second --apply run against an already-invalidated session reports that plainly and writes nothing further). 10 new tests (tests/test_cli_session_freshness.py), 408 total pass (397 pre-existing + 11, ruff/mypy/pip-audit/git-diff-check all clean) via scripts/preflight.py. Deliberately does not decide *when* a freshness check should run (still an open product/policy question -- this command is the on-demand, explicitly-invoked case, not a scheduler) and does not mint a version-N+1 session or call supersede_session(). No change to run_research_question.py, orchestrator/close_gate.py, any existing function's signature, or any ResearchSession/ResearchEvent schema field -- knowledge-engine-web is unaffected (it pins a specific knowledge-engine-ai commit and never calls research_freshness.py or this new command directly); no cross-repo action needed. Next continuation, in order of dependency: (1) the AnswerFreshness read-side projection dataclass the design doc sketches, now that session-freshness exists as a real caller to populate its pending_flips/narrative_invalidated_at-consuming fields meaningfully; (2) a caller that mints a version-N+1 session (sets answer_version=prior+1/supersedes_session_id=prior.session_id at create_session time) and calls supersede_session() on the prior version once N+1 reaches COMPLETED -- per the design doc's 'Interaction with session close gates' section; (3) the still-open product/policy decision of who/what invokes session-freshness and how often (a scheduled job, a person, a Web page load) -- this session deliberately left it manual/on-demand rather than guessing a policy; (4) once (1)-(3) land, extend the discovery_coverage ISA criterion (or add a sibling one) to cover correction/retraction findings, not just provider-attempt success; (5) AI-FRD-3/AI-FRD-4 wiring (discovery_policy.py)'s own next steps -- tune the conservative defaults against real traffic; (6) surfacing ResearchQuestionResult.discovery in Web remains Web-side work, not this repo's, and is not yet reachable in practice since Web's /ask does not pass a discovery_policy to run_research_question (a product-owner decision this repository does not make unilaterally, per discovery_policy.py's own docstring)."
  selection_rule: "Before beginning roadmap work, query live PR state. Handle failed, green, blocked, conflicted, or pending existing work according to docs/agent-development-policy.md and knowledge-engine-core's shared policy document."

