current_milestone:
  name: "Federated discovery orchestration adoption (AI-layer guidance)"
  roadmap_file: "docs/roadmap/federated_discovery_orchestration_adoption.md"
  state: "active -- AI-FRD-2's provider-coverage criterion now has a first bounded, tested slice; AI-FRD-5's rerun/diff reasoning has a first bounded, tested, unwired slice; next continuations are session-wiring work for both"
  objective: "Let Research Copilot plan bounded federated-discovery requests to Core rather than calling provider APIs directly, without ever treating provider count as evidence quality."
  known_gap: "AI-FRD-3/AI-FRD-4 wiring (discovery_policy.py) closed 2026-08-19 (see CHANGELOG.md). 2026-08-21 implemented AI-FRD-5's first exit criterion (copilot/research_freshness.py, `ke-ai research-freshness`; see CHANGELOG.md). This session (2026-08-22) implemented AI-FRD-2's first exit criterion: `run_research_question` attaches a fourth, optional (`required=False`) `discovery_coverage` ISA criterion whenever a caller supplies `discovery_policy`, evaluated from the same `DiscoveryAugmentationResult` AI-FRD-3/AI-FRD-4's wiring already produces and Core's own `completeness`/`provider_statuses` fields (no new Core or AI-client-boundary change; `required=False` so a degraded federated-discovery broadening never blocks session close, but is always explicit and inspectable, never a fabricated 'searched broadly' pass). Omitted from the ISA entirely when no `discovery_policy` is supplied, so the pre-existing three-criteria path is unchanged byte for byte. 349 tests pass (345 pre-existing plus 4 new); full local quality gate (ruff format --check, ruff check, mypy, pytest, pip-audit, git diff --check) passed via `scripts/preflight.py`. AI-FRD-2's remaining exit criteria (contradiction-search and citation-integrity criteria already exist independently as `contradiction_review`/`citation_integrity`; a correction/retraction close-gate criterion needs AI-FRD-5's rerun/diff reasoning wired into a session first) remain future work, same as AI-FRD-5's own remaining two exit criteria (corrections/retractions invalidating or qualifying prior synthesis; prior answer text versioned rather than silently overwritten), which require a durable Research Session to attach either reasoning to and remain deliberately unstarted."

