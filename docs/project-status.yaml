next_continuation:
  priority: "P5-highest-value-authorized-roadmap"
  action: "This session parsed knowledge-engine-core's three newer ProviderObservation publication-status flags (`corrected`/`expression_of_concern`/`withdrawn`) at the ke_client boundary, now that Core PR #396 ('Wire Crossref update-to relation into ProviderObservation publication-status flags', merged to Core main as 4866ebd) makes Crossref an actual source of real data for them rather than always-None schema fields. Both `FederatedProviderObservationFlags` (the at-request-time subset shared by parse_federated_discovery_result and parse_citation_snowball_result) and `FederatedCandidateObservation` (the richer persisted shape that documents itself as mirroring Core's CandidateObservationRecord.to_dict() field for field, and had drifted from it) gained the three fields, defaulting to None so older Core payloads and providers that never report them parse to explicit unknown rather than a guessed False -- the same 'absent is not negative' contract already used for `retracted`. The `ke-ai discover` / `ke-ai citation-snowball` CLI note lines surface each flag only when a provider asserted it True. Purely additive: new dataclass fields carry None defaults, no existing caller's behavior changes, and AI still does not merge, vote on, or pick an authoritative value across providers. Next continuation: (1) knowledge-engine-web's `PublicationStatusView` rendering for these fields is the remaining family-level consumer, and is Web-side work, not this repo's; (2) AI-FRD-5 (research freshness / rerun reasoning -- the 'should we rerun, what changed' judgment layer on top of federated_coverage_report() and federated_discover_history()) remains unstarted and is the largest open AI-layer slice; (3) AI-FRD-3/AI-FRD-4 wiring (discovery_policy.py)'s own next steps -- tune the conservative defaults against real traffic, AI-FRD-2 coverage-aware Research ISA, surface ResearchQuestionResult.discovery in Web -- remain open and separate. Nothing here decides what a publication-status flag *means* for evidence quality; that judgment layer does not exist yet and was deliberately not invented."
  selection_rule: "Before beginning roadmap work, query live PR state. Handle failed, green, blocked, conflicted, or pending existing work according to docs/agent-development-policy.md and knowledge-engine-core's shared policy document."

