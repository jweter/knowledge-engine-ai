name: Online evidence live fixture

on:
  pull_request:
    paths:
      - knowledge_engine_ai/ke_client.py
      - knowledge_engine_ai/copilot/online_evidence_adapter.py
      - knowledge_engine_ai/copilot/online_report.py
      - tests/test_online_research_live_fixture.py
      - .github/workflows/online-evidence-live-fixture.yml
  push:
    branches: [main]
    paths:
      - knowledge_engine_ai/ke_client.py
      - knowledge_engine_ai/copilot/online_evidence_adapter.py
      - knowledge_engine_ai/copilot/online_report.py
      - tests/test_online_research_live_fixture.py
      - .github/workflows/online-evidence-live-fixture.yml

permissions:
  contents: read

jobs:
  live-fixture:
    name: Real ke CLI against online-evidence-fixture-server
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out AI repository
        uses: actions/checkout@v7
        with:
          path: knowledge-engine-ai

      - name: Check out Core repository
        uses: actions/checkout@v7
        with:
          repository: jweter/knowledge-engine-core
          path: knowledge-engine-core
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            knowledge_engine
            README.md
            pyproject.toml
            poetry.lock

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Install AI dependencies
        working-directory: knowledge-engine-ai
        run: poetry install

      - name: Install Core runtime (default install, no vector extra)
        working-directory: knowledge-engine-core
        run: poetry install --only main

      - name: Run the real, non-mocked fixture-server integration test
        working-directory: knowledge-engine-ai
        run: |
          CORE_ENV="$(poetry -C ../knowledge-engine-core env info --path)"
          PATH="$CORE_ENV/bin:$PATH" poetry run pytest -v tests/test_online_research_live_fixture.py
