name: Apply final synthesis formatter delta

on:
  push:
    branches:
      - agent/gqr-synthesis-finalization
    paths:
      - .github/workflows/fix-synthesis-finalization-format.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/gqr-synthesis-finalization
          fetch-depth: 0

      - name: Apply exact Ruff spacing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/copilot/test_run_research_question.py")
          text = path.read_text(encoding="utf-8")
          old = "assert result.narrative_releaseable is True\n\ndef test_session_id_is_generated_and_events_are_durable("
          new = "assert result.narrative_releaseable is True\n\n\ndef test_session_id_is_generated_and_events_are_durable("
          if old not in text:
              raise SystemExit("expected formatter target not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          rm .github/workflows/fix-synthesis-finalization-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/copilot/test_run_research_question.py .github/workflows/fix-synthesis-finalization-format.yml
          git commit -m "Apply synthesis finalization formatting"
          git push origin HEAD:agent/gqr-synthesis-finalization
