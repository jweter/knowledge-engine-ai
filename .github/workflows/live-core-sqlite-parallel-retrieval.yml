name: Live Core SQLite parallel retrieval

# Rerun acceptance against BEGIN IMMEDIATE schema initialization.
on:
  push:
    branches:
      - agent/bt0-empty-json-acceptance
    paths:
      - .github/workflows/live-core-sqlite-parallel-retrieval.yml

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POETRY_VIRTUALENVS_CREATE: "false"
    steps:
      - name: Check out AI main
        uses: actions/checkout@v7
        with:
          ref: main
          path: ai

      - name: Check out Core PR head
        uses: actions/checkout@v7
        with:
          repository: jweter/knowledge-engine-core
          ref: agent/sqlite-concurrent-initialize
          path: core
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            knowledge_engine
            README.md
            pyproject.toml
            poetry.lock
            data/corpora/glp1_weight_loss/sources.csv
            data/corpora/glp1_weight_loss/evidence_records.jsonl

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install runtimes
        run: |
          python -m pip install poetry
          poetry -C core install --only main
          poetry -C ai install --only main

      - name: Stress fresh parallel retrieval initialization
        working-directory: core
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from knowledge_engine_ai.orchestrator.parallel_retrieval import run_parallel_retrieval

          question = "In healthy adults, does listening to music during exercise improve endurance performance compared with exercising without music?"
          root = Path(os.environ["RUNNER_TEMP"]) / "sqlite-parallel-retrieval"
          root.mkdir(parents=True, exist_ok=True)
          sources = Path("data/corpora/glp1_weight_loss/sources.csv").resolve()
          evidence = Path("data/corpora/glp1_weight_loss/evidence_records.jsonl").resolve()

          for index in range(5):
              data_dir = root / f"data-{index}"
              data_dir.mkdir(parents=True, exist_ok=True)
              os.environ["KE_DATA_DIR"] = str(data_dir)
              result = run_parallel_retrieval(
                  question,
                  sources=sources,
                  evidence=evidence,
                  ke_executable="ke",
              )
              print(
                  f"iteration={index} primary_error={result.primary.error!r} "
                  f"contradiction_error={result.contradiction.error!r}"
              )
              assert result.primary.error is None
              assert result.contradiction.error is None
              assert result.primary.report is not None
              assert result.contradiction.report is not None
          print("PARALLEL_SQLITE_INITIALIZATION_OK=1")
          PY
