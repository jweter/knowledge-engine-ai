name: Format BT-0

on:
  push:
    branches:
      - agent/bt0-research-benchmark
    paths:
      - .github/workflows/format-bt0.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/bt0-research-benchmark
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install ruff==0.16.4
      - name: Format benchmark files
        run: ruff format knowledge_engine_ai/research_pipeline_benchmark.py tests/test_research_pipeline_benchmark.py
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge_engine_ai/research_pipeline_benchmark.py tests/test_research_pipeline_benchmark.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Apply Ruff formatting to BT-0 benchmark"
          git push origin HEAD:agent/bt0-research-benchmark
