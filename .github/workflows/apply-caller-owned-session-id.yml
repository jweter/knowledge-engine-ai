name: Apply caller-owned session id patch

on:
  push:
    branches:
      - agent/caller-owned-session-id
    paths:
      - .github/workflows/apply-caller-owned-session-id.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/caller-owned-session-id

      - name: Apply caller-owned session ID support
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("knowledge_engine_ai/copilot/run_research_question.py")
          source = source_path.read_text(encoding="utf-8")
          old = '''    research_question_id: str | None = None,\n    answer_version: int = 1,\n'''
          new = '''    research_question_id: str | None = None,\n    session_id: str | None = None,\n    answer_version: int = 1,\n'''
          if source.count(old) != 1:
              raise SystemExit(f"signature anchor count={source.count(old)}")
          source = source.replace(old, new, 1)

          old = '''    _validate_grounded_completion_configuration(discovery_policy, grounded_completion_policy)\n\n    execution_budget = (\n'''
          new = '''    _validate_grounded_completion_configuration(discovery_policy, grounded_completion_policy)\n    if session_id is not None and not session_id.strip():\n        raise ValueError("session_id must be non-blank when supplied.")\n\n    execution_budget = (\n'''
          if source.count(old) != 1:
              raise SystemExit(f"validation anchor count={source.count(old)}")
          source = source.replace(old, new, 1)

          old = '''    session_id = str(uuid.uuid4())\n    resolved_research_question_id = research_question_id or _derive_research_question_id(question)\n'''
          new = '''    session_id = session_id or str(uuid.uuid4())\n    resolved_research_question_id = research_question_id or _derive_research_question_id(question)\n'''
          if source.count(old) != 1:
              raise SystemExit(f"session assignment anchor count={source.count(old)}")
          source = source.replace(old, new, 1)

          old = '''    Grounded completion is fail-closed at configuration time: a caller cannot request\n    acquisition/extraction without also opting into discovery and its acquisition-plan\n    step, and both policies must point at the same federated-search ledger. The\n    completion itself remains evidence-safe: only its final grounded re-retrieval may\n    replace the initial corpus report as synthesis input.\n'''
          new = '''    Grounded completion is fail-closed at configuration time: a caller cannot request\n    acquisition/extraction without also opting into discovery and its acquisition-plan\n    step, and both policies must point at the same federated-search ledger. The\n    completion itself remains evidence-safe: only its final grounded re-retrieval may\n    replace the initial corpus report as synthesis input.\n\n    ``session_id`` is an additive orchestration seam for durable callers such as Web:\n    when supplied, that exact non-blank identity is persisted and returned; when omitted,\n    this function preserves the existing behavior and generates a UUID internally.\n    Duplicate supplied identities still fail through ``SessionRepository.create_session``\n    rather than silently adopting or overwriting another run.\n'''
          if source.count(old) != 1:
              raise SystemExit(f"doc anchor count={source.count(old)}")
          source = source.replace(old, new, 1)
          source_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/copilot/test_run_research_question.py")
          tests = test_path.read_text(encoding="utf-8")
          old = '''from knowledge_engine_ai.sessions.repository import SessionRepository, new_connection\n'''
          new = '''from knowledge_engine_ai.sessions.repository import (\n    DuplicateSessionError,\n    SessionRepository,\n    new_connection,\n)\n'''
          if tests.count(old) != 1:
              raise SystemExit(f"import anchor count={tests.count(old)}")
          tests = tests.replace(old, new, 1)

          anchor = '''def test_full_run_shares_one_execution_budget_across_core_and_ollama(\n'''
          if tests.count(anchor) != 1:
              raise SystemExit(f"test insertion anchor count={tests.count(anchor)}")
          added = '''def test_caller_supplied_session_id_is_persisted_and_returned(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    monkeypatch.setattr(subprocess, "run", _fake_run(_payload(evidence_records=[_GROUNDED_RECORD])))\n    repository = _repository()\n\n    result = run_research_question(\n        "does semaglutide reduce body weight",\n        session_repository=repository,\n        sources=tmp_path / "s.csv",\n        evidence=tmp_path / "e.jsonl",\n        llm=_FakeLLM(),\n        session_id="web-session-123",\n    )\n\n    assert result.session_id == "web-session-123"\n    session = repository.get_session("web-session-123")\n    assert session is not None\n    assert session.session_id == "web-session-123"\n\n\ndef test_omitted_session_id_still_generates_unique_identities(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    monkeypatch.setattr(subprocess, "run", _fake_run(_payload(evidence_records=[_GROUNDED_RECORD])))\n    repository = _repository()\n\n    first = run_research_question(\n        "does semaglutide reduce body weight",\n        session_repository=repository,\n        sources=tmp_path / "s.csv",\n        evidence=tmp_path / "e.jsonl",\n        llm=_FakeLLM(),\n    )\n    second = run_research_question(\n        "does semaglutide reduce body weight",\n        session_repository=repository,\n        sources=tmp_path / "s.csv",\n        evidence=tmp_path / "e.jsonl",\n        llm=_FakeLLM(),\n    )\n\n    assert first.session_id\n    assert second.session_id\n    assert first.session_id != second.session_id\n\n\ndef test_blank_caller_session_id_is_rejected_before_execution(tmp_path: Path) -> None:\n    with pytest.raises(ValueError, match="session_id must be non-blank"):\n        run_research_question(\n            "does semaglutide reduce body weight",\n            session_repository=_repository(),\n            sources=tmp_path / "s.csv",\n            evidence=tmp_path / "e.jsonl",\n            llm=_FakeLLM(),\n            session_id="   ",\n        )\n\n\ndef test_duplicate_caller_session_id_fails_closed(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    monkeypatch.setattr(subprocess, "run", _fake_run(_payload(evidence_records=[_GROUNDED_RECORD])))\n    repository = _repository()\n    kwargs = {\n        "session_repository": repository,\n        "sources": tmp_path / "s.csv",\n        "evidence": tmp_path / "e.jsonl",\n        "llm": _FakeLLM(),\n        "session_id": "web-session-duplicate",\n    }\n\n    run_research_question("does semaglutide reduce body weight", **kwargs)\n    with pytest.raises(DuplicateSessionError):\n        run_research_question("does semaglutide reduce body weight", **kwargs)\n\n\n'''
          tests = tests.replace(anchor, added + anchor, 1)
          test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Format and focused tests
        run: |
          python -m pip install poetry
          poetry install
          poetry run ruff format knowledge_engine_ai/copilot/run_research_question.py tests/copilot/test_run_research_question.py
          poetry run ruff check knowledge_engine_ai/copilot/run_research_question.py tests/copilot/test_run_research_question.py
          poetry run mypy knowledge_engine_ai/copilot/run_research_question.py tests/copilot/test_run_research_question.py
          poetry run pytest -q tests/copilot/test_run_research_question.py

      - name: Commit source changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge_engine_ai/copilot/run_research_question.py tests/copilot/test_run_research_question.py
          git commit -m "Allow durable callers to supply research session IDs"
          git rm .github/workflows/apply-caller-owned-session-id.yml
          git commit -m "Remove temporary caller session patch workflow"
          git push origin HEAD:agent/caller-owned-session-id
