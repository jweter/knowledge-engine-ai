name: Apply indexed retrieval cache patch

on:
  push:
    branches:
      - agent/indexed-retrieval-cache
    paths:
      - .github/workflows/apply-indexed-retrieval-cache.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/indexed-retrieval-cache

      - name: Apply observability and benchmark integration
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:100]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          workflow = Path("knowledge_engine_ai/orchestrator/workflow.py")
          replace_once(
              workflow,
              '''            error=parallel_result.primary.error,\n            duration_ms=retrieval_duration_ms,\n''',
              '''            error=parallel_result.primary.error,\n            notes=f"retrieval_cache_hit={str(parallel_result.primary.cache_hit).lower()}",\n            duration_ms=retrieval_duration_ms,\n''',
          )
          replace_once(
              workflow,
              '''            error=parallel_result.contradiction.error,\n            duration_ms=retrieval_duration_ms,\n''',
              '''            error=parallel_result.contradiction.error,\n            notes=(\n                f"retrieval_cache_hit={str(parallel_result.contradiction.cache_hit).lower()}"\n            ),\n            duration_ms=retrieval_duration_ms,\n''',
          )
          replace_once(
              workflow,
              '''    error: str | None,\n    duration_ms: int | None = None,\n''',
              '''    error: str | None,\n    notes: str | None = None,\n    duration_ms: int | None = None,\n''',
          )
          replace_once(
              workflow,
              '''        notes=error,\n        duration_ms=duration_ms,\n''',
              '''        notes=error if error is not None else notes,\n        duration_ms=duration_ms,\n''',
          )

          benchmark = Path("knowledge_engine_ai/research_pipeline_benchmark.py")
          replace_once(
              benchmark,
              '''    reretrieval_attempt_count: int\n    reuse_hit: bool\n''',
              '''    reretrieval_attempt_count: int\n    primary_indexed_retrieval_cache_hit: bool\n    contradiction_indexed_retrieval_cache_hit: bool\n    reuse_hit: bool\n''',
          )
          replace_once(
              benchmark,
              '''            "reretrieval_attempt_count": self.reretrieval_attempt_count,\n            "reuse_hit": self.reuse_hit,\n''',
              '''            "reretrieval_attempt_count": self.reretrieval_attempt_count,\n            "primary_indexed_retrieval_cache_hit": (\n                self.primary_indexed_retrieval_cache_hit\n            ),\n            "contradiction_indexed_retrieval_cache_hit": (\n                self.contradiction_indexed_retrieval_cache_hit\n            ),\n            "reuse_hit": self.reuse_hit,\n''',
          )
          replace_once(
              benchmark,
              '''    completion = result.grounded_completion\n    routes = completion.acquisition_routes if completion is not None else ()\n''',
              '''    parallel_retrieval = result.workflow.parallel_retrieval\n    primary_cache_hit = (\n        parallel_retrieval.primary.cache_hit if parallel_retrieval is not None else False\n    )\n    contradiction_cache_hit = (\n        parallel_retrieval.contradiction.cache_hit if parallel_retrieval is not None else False\n    )\n\n    completion = result.grounded_completion\n    routes = completion.acquisition_routes if completion is not None else ()\n''',
          )
          replace_once(
              benchmark,
              '''        reretrieval_attempt_count=reretrieval_attempt_count,\n        reuse_hit=(reused_paper_count > 0 or dispositions.get("already_indexed", 0) > 0),\n''',
              '''        reretrieval_attempt_count=reretrieval_attempt_count,\n        primary_indexed_retrieval_cache_hit=primary_cache_hit,\n        contradiction_indexed_retrieval_cache_hit=contradiction_cache_hit,\n        reuse_hit=(\n            reused_paper_count > 0\n            or dispositions.get("already_indexed", 0) > 0\n            or primary_cache_hit\n            or contradiction_cache_hit\n        ),\n''',
          )

          tests = Path("tests/test_research_pipeline_benchmark.py")
          replace_once(
              tests,
              '''def _workflow(*, indexed_ids: tuple[str, ...]) -> WorkflowResult:\n    primary = RetrievalBranchResult(query=QUESTION, report=None, error=None)\n    contradiction = RetrievalBranchResult(\n        query=f"{QUESTION} contradiction", report=None, error=None\n    )\n''',
              '''def _workflow(\n    *,\n    indexed_ids: tuple[str, ...],\n    primary_cache_hit: bool = False,\n    contradiction_cache_hit: bool = False,\n) -> WorkflowResult:\n    primary = RetrievalBranchResult(\n        query=QUESTION, report=None, error=None, cache_hit=primary_cache_hit\n    )\n    contradiction = RetrievalBranchResult(\n        query=f"{QUESTION} contradiction",\n        report=None,\n        error=None,\n        cache_hit=contradiction_cache_hit,\n    )\n''',
          )
          marker = '''def test_repeat_suite_reports_speedup_and_reuse() -> None:\n'''
          insertion = '''def test_benchmark_reports_per_branch_indexed_retrieval_cache_hits() -> None:\n    result = _result()\n    cached_result = _Result(\n        session_id=result.session_id,\n        question=result.question,\n        workflow=_workflow(\n            indexed_ids=(),\n            primary_cache_hit=True,\n            contradiction_cache_hit=True,\n        ),\n        discovery=result.discovery,\n        grounded_completion=result.grounded_completion,\n        close_result=result.close_result,\n        trace=result.trace,\n        narrative_releaseable=result.narrative_releaseable,\n        used_reretrieved_evidence=result.used_reretrieved_evidence,\n    )\n\n    run = build_research_benchmark_run(\n        cached_result,\n        scenario_id="fresh-music-endurance",\n        run_number=2,\n        run_temperature="warm",\n        wall_clock_duration_ms=1200,\n    )\n\n    assert run.funnel.primary_indexed_retrieval_cache_hit is True\n    assert run.funnel.contradiction_indexed_retrieval_cache_hit is True\n    assert run.funnel.reuse_hit is True\n\n\n'''
          replace_once(tests, marker, insertion + marker)

          cache_tests = Path("tests/orchestrator/test_retrieval_cache.py")
          cache_tests.parent.mkdir(parents=True, exist_ok=True)
          cache_tests.write_text(
              '''from __future__ import annotations\n\nfrom pathlib import Path\n\nimport pytest\n\nfrom knowledge_engine_ai.ke_client import KeCommandError\nfrom knowledge_engine_ai.models import EvidenceReport, parse_evidence_report\nfrom knowledge_engine_ai.orchestrator import parallel_retrieval\nfrom knowledge_engine_ai.orchestrator.retrieval_cache import (\n    clear_retrieval_cache,\n    normalize_retrieval_query,\n    retrieval_cache_size,\n)\n\n\n@pytest.fixture(autouse=True)\ndef _isolated_cache() -> None:\n    clear_retrieval_cache()\n    yield\n    clear_retrieval_cache()\n\n\ndef _report(question: str) -> EvidenceReport:\n    return parse_evidence_report(\n        {\n            "schema_version": 1,\n            "question": question,\n            "sources_path": "sources.csv",\n            "evidence_path": "evidence.jsonl",\n            "evidence_summary": {\n                "total": 0,\n                "draft": 0,\n                "reviewed": 0,\n                "needs_revision": 0,\n                "rejected": 0,\n                "unspecified": 0,\n                "readiness_note": "empty",\n            },\n            "papers": [],\n            "disclaimer": "retrieval plus recorded evidence only",\n        }\n    )\n\n\ndef _indexed_files(tmp_path: Path) -> tuple[Path, Path]:\n    sources = tmp_path / "sources.csv"\n    evidence = tmp_path / "evidence.jsonl"\n    sources.write_text("paper_id,title\\n1,Example\\n", encoding="utf-8")\n    evidence.write_text('{"evidence_record_id":"ev-1"}\\n', encoding="utf-8")\n    return sources, evidence\n\n\ndef test_normalize_retrieval_query_collapses_case_and_whitespace() -> None:\n    assert normalize_retrieval_query("  Does   MUSIC Help? ") == "does music help?"\n\n\ndef test_repeated_parallel_retrieval_reuses_both_successful_branches(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    sources, evidence = _indexed_files(tmp_path)\n    calls: list[str] = []\n\n    def fake_report(query: str, **kwargs: object) -> EvidenceReport:\n        calls.append(query)\n        return _report(query)\n\n    monkeypatch.setattr(parallel_retrieval, "enriched_evidence_report", fake_report)\n\n    first = parallel_retrieval.run_parallel_retrieval(\n        "Does music improve endurance?", sources=sources, evidence=evidence\n    )\n    second = parallel_retrieval.run_parallel_retrieval(\n        "  does MUSIC improve   endurance?  ", sources=sources, evidence=evidence\n    )\n\n    assert len(calls) == 2\n    assert first.primary.cache_hit is False\n    assert first.contradiction.cache_hit is False\n    assert second.primary.cache_hit is True\n    assert second.contradiction.cache_hit is True\n\n\ndef test_evidence_content_change_invalidates_cached_branches(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    sources, evidence = _indexed_files(tmp_path)\n    calls: list[str] = []\n\n    def fake_report(query: str, **kwargs: object) -> EvidenceReport:\n        calls.append(query)\n        return _report(query)\n\n    monkeypatch.setattr(parallel_retrieval, "enriched_evidence_report", fake_report)\n\n    parallel_retrieval.run_parallel_retrieval(\n        "Does music improve endurance?", sources=sources, evidence=evidence\n    )\n    evidence.write_text(\n        evidence.read_text(encoding="utf-8") + '{"evidence_record_id":"ev-2"}\\n',\n        encoding="utf-8",\n    )\n    changed = parallel_retrieval.run_parallel_retrieval(\n        "Does music improve endurance?", sources=sources, evidence=evidence\n    )\n\n    assert len(calls) == 4\n    assert changed.primary.cache_hit is False\n    assert changed.contradiction.cache_hit is False\n\n\ndef test_failed_retrieval_is_never_cached(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    sources, evidence = _indexed_files(tmp_path)\n    attempts: dict[str, int] = {}\n\n    def flaky_report(query: str, **kwargs: object) -> EvidenceReport:\n        attempts[query] = attempts.get(query, 0) + 1\n        if attempts[query] == 1:\n            raise KeCommandError("temporary retrieval failure")\n        return _report(query)\n\n    monkeypatch.setattr(parallel_retrieval, "enriched_evidence_report", flaky_report)\n\n    first = parallel_retrieval.run_parallel_retrieval(\n        "Does music improve endurance?", sources=sources, evidence=evidence\n    )\n    second = parallel_retrieval.run_parallel_retrieval(\n        "Does music improve endurance?", sources=sources, evidence=evidence\n    )\n    third = parallel_retrieval.run_parallel_retrieval(\n        "Does music improve endurance?", sources=sources, evidence=evidence\n    )\n\n    assert first.primary.error is not None\n    assert first.contradiction.error is not None\n    assert second.primary.cache_hit is False\n    assert second.contradiction.cache_hit is False\n    assert third.primary.cache_hit is True\n    assert third.contradiction.cache_hit is True\n    assert set(attempts.values()) == {2}\n\n\ndef test_external_discovery_still_runs_when_indexed_retrieval_is_cached(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    sources, evidence = _indexed_files(tmp_path)\n    discovery_calls: list[str] = []\n\n    monkeypatch.setattr(\n        parallel_retrieval,\n        "enriched_evidence_report",\n        lambda query, **kwargs: _report(query),\n    )\n\n    def discover(question: str) -> object:\n        discovery_calls.append(question)\n        return {"ok": True}\n\n    parallel_retrieval.run_parallel_retrieval(\n        "Does music improve endurance?",\n        sources=sources,\n        evidence=evidence,\n        external_discovery=discover,\n    )\n    cached = parallel_retrieval.run_parallel_retrieval(\n        "Does music improve endurance?",\n        sources=sources,\n        evidence=evidence,\n        external_discovery=discover,\n    )\n\n    assert cached.primary.cache_hit is True\n    assert cached.contradiction.cache_hit is True\n    assert discovery_calls == [\n        "Does music improve endurance?",\n        "Does music improve endurance?",\n    ]\n\n\ndef test_cache_is_bounded_to_sixty_four_entries(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    sources, evidence = _indexed_files(tmp_path)\n    monkeypatch.setattr(\n        parallel_retrieval,\n        "enriched_evidence_report",\n        lambda query, **kwargs: _report(query),\n    )\n\n    for index in range(40):\n        parallel_retrieval.run_parallel_retrieval(\n            f"Question {index}?", sources=sources, evidence=evidence\n        )\n\n    assert retrieval_cache_size() == 64\n''',
              encoding="utf-8",
          )
          PY

      - name: Run focused checks
        run: |
          python -m pip install poetry
          poetry install
          poetry run ruff format --check knowledge_engine_ai/orchestrator/retrieval_cache.py \
            knowledge_engine_ai/orchestrator/parallel_retrieval.py \
            knowledge_engine_ai/orchestrator/workflow.py \
            knowledge_engine_ai/research_pipeline_benchmark.py \
            tests/orchestrator/test_retrieval_cache.py \
            tests/test_research_pipeline_benchmark.py
          poetry run ruff check knowledge_engine_ai/orchestrator/retrieval_cache.py \
            knowledge_engine_ai/orchestrator/parallel_retrieval.py \
            knowledge_engine_ai/orchestrator/workflow.py \
            knowledge_engine_ai/research_pipeline_benchmark.py \
            tests/orchestrator/test_retrieval_cache.py \
            tests/test_research_pipeline_benchmark.py
          poetry run mypy knowledge_engine_ai
          poetry run pytest -q tests/orchestrator/test_retrieval_cache.py tests/test_research_pipeline_benchmark.py tests/test_parallel_retrieval.py

      - name: Commit cache integration
        run: |
          git rm .github/workflows/apply-indexed-retrieval-cache.yml
          git add knowledge_engine_ai/orchestrator/retrieval_cache.py \
                  knowledge_engine_ai/orchestrator/parallel_retrieval.py \
                  knowledge_engine_ai/orchestrator/workflow.py \
                  knowledge_engine_ai/research_pipeline_benchmark.py \
                  tests/orchestrator/test_retrieval_cache.py \
                  tests/test_research_pipeline_benchmark.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Expose indexed retrieval cache reuse"
          git push origin HEAD:agent/indexed-retrieval-cache
