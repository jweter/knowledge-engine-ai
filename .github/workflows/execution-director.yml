name: Execution Director

on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: "23 * * * *"

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build portfolio execution plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python engineering/execution_director.py plan --output execution-plan.json
      - uses: actions/upload-artifact@v7
        with:
          name: execution-plan
          path: execution-plan.json
          retention-days: 30
