name: Apply synthesis finalization regression update

on:
  push:
    branches:
      - agent/gqr-synthesis-finalization
    paths:
      - .github/workflows/apply-synthesis-finalization-test.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/gqr-synthesis-finalization
          fetch-depth: 0

      - name: Update orchestrator qualifier regression
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/copilot/test_run_research_question.py")
          text = path.read_text(encoding="utf-8")
          start_marker = "def test_missed_qualifying_evidence_blocks_session_close("
          end_marker = "\ndef test_session_id_is_generated_and_events_are_durable("
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''def test_missed_qualifying_evidence_is_appended_before_session_close(
              tmp_path: Path, monkeypatch: pytest.MonkeyPatch
          ) -> None:
              monkeypatch.setattr(
                  subprocess,
                  "run",
                  _fake_run(_payload(evidence_records=[_GROUNDED_RECORD, _QUALIFYING_RECORD])),
              )
              repository = _repository()
              # The small model cites only ev-1. Synthesis must append ev-2 from the
              # retrieved evidence rather than weakening the contradiction-review gate.
              llm = _FakeLLM(response="Semaglutide reduced body weight [ev-1].")

              result = run_research_question(
                  "does semaglutide reduce body weight",
                  session_repository=repository,
                  sources=tmp_path / "s.csv",
                  evidence=tmp_path / "e.jsonl",
                  llm=llm,
              )

              assert result.narrative is not None
              assert "Semaglutide reduced body weight [ev-1]." in result.narrative
              assert "Evidence qualifications and limitations:" in result.narrative
              assert "[ev-2]" in result.narrative
              assert result.verification is not None
              assert result.verification.missed_qualifiers == ()
              assert result.verification.is_clean
              assert result.close_result.status is SessionStatus.COMPLETED
              assert result.narrative_releaseable is True
          '''
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY

          rm .github/workflows/apply-synthesis-finalization-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/copilot/test_run_research_question.py .github/workflows/apply-synthesis-finalization-test.yml
          git commit -m "Update qualifier release regression"
          git push origin HEAD:agent/gqr-synthesis-finalization
