name: Engineering Compounding Report

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * *"

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build evidence-derived compounding report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: >
          python engineering/compounding_metrics.py
          --window-days 30
          --output engineering-compounding-report.json
      - uses: actions/upload-artifact@v7
        with:
          name: engineering-compounding-report
          path: engineering-compounding-report.json
          retention-days: 90
