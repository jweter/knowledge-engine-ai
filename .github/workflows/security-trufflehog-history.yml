name: Security - TruffleHog History

on:
  pull_request:
    paths:
      - .github/workflows/security-trufflehog-history.yml
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * 1"

permissions:
  contents: read

concurrency:
  group: trufflehog-history-${{ github.repository }}
  cancel-in-progress: true

jobs:
  history-scan:
    name: Deep history secret audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out full repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned TruffleHog
        env:
          TRUFFLEHOG_VERSION: "3.97.1"
          TRUFFLEHOG_ARCHIVE_SHA256: "f863ea3a8d786f7d097870496c977944cce7372a2fe1e56707d965016e543ece"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/trufflehog.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$TRUFFLEHOG_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$RUNNER_TEMP" trufflehog
          chmod 0755 "$RUNNER_TEMP/trufflehog"
          "$RUNNER_TEMP/trufflehog" --version

      - name: Verify scanner detects an ephemeral synthetic secret
        run: |
          set -euo pipefail
          fixture_dir="$(mktemp -d)"
          trap 'rm -rf "$fixture_dir"' EXIT
          openssl genrsa -out "$fixture_dir/ephemeral-private-key.pem" 2048 >/dev/null 2>&1

          set +e
          "$RUNNER_TEMP/trufflehog" filesystem \
            --no-verification \
            --no-update \
            --fail \
            "$fixture_dir" \
            >"$RUNNER_TEMP/trufflehog-history-self-test.log" 2>&1
          status=$?
          set -e
          rm -f "$RUNNER_TEMP/trufflehog-history-self-test.log"

          if [ "$status" -ne 183 ]; then
            echo "::error::TruffleHog history self-test expected exit 183 for the ephemeral fixture; got $status."
            exit 1
          fi

      - name: Scan reachable Git history without credential verification
        run: |
          set -euo pipefail

          # Full-history baseline scan (2026-08-29) found no secret-like
          # material, so no detector classes are excluded here. If a future
          # scan surfaces a confirmed repository-specific false positive,
          # document the detector class and rationale here before excluding it.
          set +e
          "$RUNNER_TEMP/trufflehog" git "file://$GITHUB_WORKSPACE" \
            --no-verification \
            --no-update \
            --fail \
            >"$RUNNER_TEMP/trufflehog-history-scan.log" 2>&1
          status=$?
          set -e
          rm -f "$RUNNER_TEMP/trufflehog-history-scan.log"

          case "$status" in
            0)
              echo "TruffleHog found no secret-like material in reachable repository history."
              ;;
            183)
              echo "::error::TruffleHog detected secret-like material in reachable repository history. Results are intentionally not printed or uploaded. Reproduce in an authorized local environment and classify before merge."
              exit 1
              ;;
            *)
              echo "::error::TruffleHog history scan failed with exit code $status. Results are intentionally not printed or uploaded."
              exit "$status"
              ;;
          esac
