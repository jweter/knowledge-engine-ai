name: Promote Preflight-Green Branch

on:
  workflow_run:
    workflows: ["Preflight"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  promote:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'orchestrator/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Download exact-head preflight evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run download "$RUN_ID" --name preflight-evidence --dir .preflight
      - name: Verify canonical exact-head evidence
        run: python engineering/orchestrator_ops.py verify-preflight --evidence .preflight/preflight-evidence.json
      - name: Open or promote pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          PR_NUMBER="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$PR_NUMBER" ]; then
            gh pr create               --base main               --head "$BRANCH"               --title "Control-plane automated development"               --body "Exact-head canonical FULL preflight is GREEN for `$HEAD_SHA`. Fresh independent PR CI remains required before merge."
          else
            IS_DRAFT="$(gh pr view "$PR_NUMBER" --json isDraft --jq '.isDraft')"
            if [ "$IS_DRAFT" = "true" ]; then
              gh pr ready "$PR_NUMBER"
            fi
          fi
