name: Apply batch review limit patch

on:
  push:
    branches:
      - agent/batch-grounded-review-limit
    paths:
      - .github/workflows/apply-batch-review-limit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/batch-grounded-review-limit
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Patch batch limit and regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("knowledge_engine_ai/copilot/grounded_completion.py")
          text = source.read_text(encoding="utf-8")
          old = '"--model",\n                    policy.grounding_model,\n                ],\n                operation="ke evidence-review-automate (batch)",'
          new = '"--model",\n                    policy.grounding_model,\n                    "--limit",\n                    str(len(staged_ids)),\n                ],\n                operation="ke evidence-review-automate (batch)",'
          if text.count(old) != 1:
              raise SystemExit(f"expected one source match, found {text.count(old)}")
          source.write_text(text.replace(old, new), encoding="utf-8")

          test = Path("tests/copilot/test_grounded_completion.py")
          text = test.read_text(encoding="utf-8")
          old = '            assert "--evidence-record-id" not in command\n            records = [json.loads(line) for line in staged.read_text().splitlines() if line]\n            for record in records:'
          new = '            assert "--evidence-record-id" not in command\n            records = [json.loads(line) for line in staged.read_text().splitlines() if line]\n            assert command[command.index("--limit") + 1] == str(len(records))\n            for record in records:'
          if text.count(old) < 1:
              raise SystemExit("expected test grounding branch not found")
          test.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Focused checks
        run: |
          python -m pip install poetry
          poetry install
          poetry run ruff format knowledge_engine_ai/copilot/grounded_completion.py tests/copilot/test_grounded_completion.py
          poetry run ruff check knowledge_engine_ai/copilot/grounded_completion.py tests/copilot/test_grounded_completion.py
          poetry run pytest tests/copilot/test_grounded_completion.py -q
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-batch-review-limit.yml
          git add knowledge_engine_ai/copilot/grounded_completion.py tests/copilot/test_grounded_completion.py
          git commit -m "Process every bounded record in batch grounded review"
          git push origin HEAD:agent/batch-grounded-review-limit
