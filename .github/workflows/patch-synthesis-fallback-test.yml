name: Patch synthesis fallback integration expectation

on:
  push:
    branches:
      - agent/synthesis-release-resilience
    paths:
      - .github/workflows/patch-synthesis-fallback-test.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/synthesis-release-resilience
      - name: Update legacy model-failure expectation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/copilot/test_run_research_question.py")
          text = path.read_text(encoding="utf-8")
          old = '''    assert result.narrative is None
    assert result.synthesis_error == "Could not reach Ollama."
    assert result.verification is None
    # The ISA close gate is scoped to narrative correctness, not synthesis
    # availability -- a synthesis failure is durable/visible (below) but
    # does not block session close.
    assert result.close_result.status is SessionStatus.COMPLETED

    synthesis_events = [
        event
        for event in repository.list_events(result.session_id)
        if event.workflow_node == "synthesis"
    ]
    assert len(synthesis_events) == 1
    assert synthesis_events[0].validation_status == "failed"
    assert synthesis_events[0].notes == "Could not reach Ollama."
'''
          new = '''    assert result.narrative is not None
    assert result.narrative.startswith("Evidence-only summary (deterministic fallback):")
    assert "[ev-1]" in result.narrative
    assert result.synthesis_error is None
    assert result.verification is not None
    assert result.verification.is_clean
    assert result.narrative_releaseable is True
    assert result.close_result.status is SessionStatus.COMPLETED

    synthesis_events = [
        event
        for event in repository.list_events(result.session_id)
        if event.workflow_node == "synthesis"
    ]
    assert len(synthesis_events) == 1
    assert synthesis_events[0].validation_status == "succeeded"
    assert synthesis_events[0].notes == result.narrative
'''
          if old not in text:
              raise SystemExit("target test block not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git rm .github/workflows/patch-synthesis-fallback-test.yml
          git add tests/copilot/test_run_research_question.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Expect grounded fallback when local synthesis fails"
          git push origin HEAD:agent/synthesis-release-resilience
