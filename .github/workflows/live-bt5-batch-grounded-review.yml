name: Live BT-5 batch grounded review

on:
  push:
    branches:
      - agent/bt0-empty-json-acceptance
    paths:
      - .github/workflows/live-bt5-batch-grounded-review.yml

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POETRY_VIRTUALENVS_CREATE: "false"
      KE_DATA_DIR: /tmp/ke-core-data
      KE_LLM_MODEL: qwen2.5:0.5b
      KE_OLLAMA_HOST: http://127.0.0.1:11434
    steps:
      - name: Check out merged AI main
        uses: actions/checkout@v7
        with:
          ref: main
          path: ai

      - name: Check out Core SQLite concurrency PR
        uses: actions/checkout@v7
        with:
          repository: jweter/knowledge-engine-core
          ref: agent/sqlite-concurrent-initialize
          path: core
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            knowledge_engine
            README.md
            pyproject.toml
            poetry.lock
            data/corpora/glp1_weight_loss/sources.csv
            data/corpora/glp1_weight_loss/evidence_records.jsonl

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install runtimes
        run: |
          python -m pip install poetry
          poetry -C core install --only main
          poetry -C ai install --only main

      - name: Start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          if ! curl -sf http://127.0.0.1:11434/api/tags >/dev/null; then
            ollama serve >"${RUNNER_TEMP}/ollama.log" 2>&1 &
          fi
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 1
          done
          ollama pull qwen2.5:0.5b

      - name: Prepare isolated corpus
        run: |
          mkdir -p "${RUNNER_TEMP}/bt5/ledger" "${RUNNER_TEMP}/bt5/papers" "${KE_DATA_DIR}"
          cp core/data/corpora/glp1_weight_loss/sources.csv "${RUNNER_TEMP}/bt5/sources.csv"
          cp core/data/corpora/glp1_weight_loss/evidence_records.jsonl "${RUNNER_TEMP}/bt5/evidence.jsonl"

      - name: Run unchanged cold benchmark
        working-directory: core
        run: |
          set -o pipefail
          QUESTION='In healthy adults, does listening to music during exercise improve endurance performance compared with exercising without music?'
          ke-ai-research-benchmark "$QUESTION" \
            --sources "${RUNNER_TEMP}/bt5/sources.csv" \
            --evidence "${RUNNER_TEMP}/bt5/evidence.jsonl" \
            --session-db "${RUNNER_TEMP}/bt5/sessions.sqlite3" \
            --ledger-root "${RUNNER_TEMP}/bt5/ledger" \
            --papers-dir "${RUNNER_TEMP}/bt5/papers" \
            --llm-model qwen2.5:0.5b \
            --ke-executable "$(command -v ke)" \
            --providers pubmed,semantic_scholar \
            --repeats 1 \
            --timeout-seconds 240 \
            --scenario-id fresh-music-endurance-batch-grounded-review-sqlite-fix \
            --output "${RUNNER_TEMP}/bt5/benchmark.json" \
            2>&1 | tee "${RUNNER_TEMP}/bt5/benchmark.log"

      - name: Require releaseable answer and report timing
        run: |
          python - <<'PY' | tee "${RUNNER_TEMP}/bt5/summary.log"
          import json, os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "bt5" / "benchmark.json"
          payload = json.loads(path.read_text())
          run = payload["runs"][0]
          stages = run["bottleneck_report"]["stages"]
          extraction = next((s for s in stages if s["stage"] == "extraction_promotion"), None)
          summary = {
              "wall_ms": run["wall_clock_duration_ms"],
              "releaseable": run["narrative_releaseable"],
              "final_state": run["final_state"]["state"],
              "extraction_ms": extraction["duration_ms"] if extraction else None,
              "promoted": run["funnel"]["promoted_evidence_record_count"],
          }
          print(summary)
          assert run["narrative_releaseable"] is True, run
          assert run["final_state"]["state"] not in {"blocked", "insufficient_evidence"}, run
          PY

      - name: Upload benchmark diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bt5-batch-grounded-review-sqlite-fix
          path: |
            ${{ runner.temp }}/bt5/benchmark.json
            ${{ runner.temp }}/bt5/benchmark.log
            ${{ runner.temp }}/bt5/summary.log
            ${{ runner.temp }}/bt5/sessions.sqlite3
            ${{ runner.temp }}/ollama.log
          if-no-files-found: warn
