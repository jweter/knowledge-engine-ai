name: Preflight

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Canonical preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: python -m pip install poetry
      - name: Install dependencies
        run: poetry install
      - name: Run full preflight
        run: python engineering/preflight.py --evidence preflight-evidence.json
      - uses: actions/upload-artifact@v7
        with:
          name: preflight-evidence
          path: preflight-evidence.json
